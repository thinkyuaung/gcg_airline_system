 <!-- MAIN NAVBAR WITH STICKY TOP EFFECT -->
<nav id="mainNav" th:fragment="header" class="navbar navbar-expand-lg bg-white border-bottom py-2 sticky-top shadow-sm">
    <div class="container">
        
        <!-- BRAND LOGO -->
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/airline/index}">
            <div class="brand-icon">
                <img th:src="@{/images/Maubin AirLine Logo.png}" alt="Maubin AirLine Logo" class="brand-logo-img">
            </div> 
            <span class="fw-bold text-dark fs-5">Maubin International AirLine</span>
        </a>

        <!-- MOBILE TOGGLER -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAV LINKS & BUTTONS -->
        <div class="collapse navbar-collapse" id="navMenu">   
            
            <!-- NAV LINKS WITH DYNAMIC THYMELEAF ACTIVE STATE -->
            <ul class="navbar-nav mx-auto gap-lg-4 gap-2 mt-3 mt-lg-0 fw-semibold">
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${activeTab == '/'} ? 'active' : ''" 
                       th:href="@{/airline/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${activeTab == 'flights'} ? 'active' : ''" 
                       th:href="@{/airline/flights}">Flights</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'manage'} ? 'active' : ''"
                       th:href="@{/airline/manage-booking}">Manage Booking</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${activeTab == 'about'} ? 'active' : ''" 
                       th:href="@{/airline/about}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${activeTab == 'support'} ? 'active' : ''" 
                       th:href="@{/airline/support}">Support</a>
                </li>
            </ul>

            <!-- Right Controls Container with spacing gap -->
            <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0 ms-lg-auto">
                
                <!-- Clean Search Bar Container -->
                <div class="search-box-wrapper d-none d-md-block">
                    <i class="bi bi-search search-icon"></i>
                    <input 
                        type="text" 
                        class="form-control search-input" 
                        placeholder="Search..." 
                        aria-label="Search"
                    />
                </div>

                <!-- ================= GUEST ================= -->

<div sec:authorize="!isAuthenticated()">

    <a th:href="@{/airline/login}"
       class="btn btn-outline-primary px-3 fw-bold rounded-pill ms-2">

        <i class="bi bi-person me-1"></i>
        Login

    </a>


    <a th:href="@{/airline/signup}"
       class="btn btn-primary px-3 fw-bold rounded-pill">

        <i class="bi bi-person-plus-fill me-1"></i>
        Sign Up

    </a>

</div>




<!-- ================= USER ================= -->

<div sec:authorize="hasRole('USER')">

    <a th:href="@{/airline/dashboard}"
       class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center"
       style="width:45px;height:45px;">

        <i class="bi bi-person-fill fs-5"></i>

    </a>

</div>




<!-- ================= ADMIN ================= -->

<div sec:authorize="hasRole('ADMIN')">

    <a th:href="@{/airline/admin/dashboard}"
       class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center"
       style="width:45px;height:45px;">

        <i class="bi bi-person-gear fs-5"></i>

    </a>

</div>

        </div> <!-- Closed collapse navbar-collapse -->
    </div> <!-- Closed container -->
</nav>
 
</body>
    
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Get current URL path
        const currentPath = window.location.pathname;
        
        // Target all navigation links
        const navLinks = document.querySelectorAll('#navMenu .nav-link');

        navLinks.forEach(link => {
            // Remove hardcoded active classes
            link.classList.remove('active');

            // Compare link href attribute with current pathname
            const linkHref = link.getAttribute('href');
            if (linkHref && currentPath === linkHref) {
                link.classList.add('active');
            }
        });
    });
</script>
</html>
