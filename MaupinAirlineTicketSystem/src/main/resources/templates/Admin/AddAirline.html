<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airline Administration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal Custom Styling */
    .modal-content {
      border: none;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
    }

    .modal-header {
      border-bottom: 1px solid #edf2f7;
      background-color: #fafbfc;
      padding: 1.5rem;
    }

    .modal-title {
      color: #1a202c;
      font-size: 1.25rem;
    }

    .modal-body {
      padding: 2rem 1.5rem;
    }

    /* Form Design Details */
    .form-label {
      color: #4a5568;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .form-control {
      border: 1.5px solid #e2e8f0;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #2d3748;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
      background-color: #fff;
    }

    .form-control::placeholder {
      color: #a0aec0;
      font-size: 0.9rem;
    }

    /* File upload field specific styling */
    .form-control[type="file"] {
      padding: 0.6rem 0.75rem;
    }

    /* Custom Button Styles */
    .btn-primary {
      background-color: #3182ce;
      border: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #2b6cb0;
      transform: translateY(-1px);
    }

    .btn-light {
      background-color: #edf2f7;
      color: #4a5568;
      border: none;
      font-weight: 500;
    }

    .btn-light:hover {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .modal-footer {
      border-top: 1px solid #edf2f7;
      background-color: #fafbfc;
      padding: 1.25rem 1.5rem;
      
    }
    
  </style>
</head>
<body>

  <div>
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header d-flex align-items-center login-bar">
          <h5 class="modal-title fw-bold">
            <i class="bi bi-airplane-fill text-primary me-2"></i>
            <span th:text="${airline.airlineId != 0} ? 'Update Airline Profile' : 'Add New Airline Profile'">Add New Airline Profile</span>
          </h5>
          <a th:href="@{/airline/admin/airlines}" class="btn-close" aria-label="Close"></a>
        </div>
        
        <form th:action="@{/airline/admin/airline}" th:object="${airline}" 
			method="post"
			enctype="multipart/form-data">
			<input type="hidden" th:field="*{airlineId}" />
          <div class="modal-body">
            
            

            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Airline Code</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-hash"></i></span>
                <input type="text" name="airlineCode" class="form-control border-start-0" placeholder="e.g., SN" required th:field="*{airlineCode}">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Airline Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-tag"></i></span>
                <input type="text" name="airlineName" class="form-control border-start-0" placeholder="e.g., SkyNest Airways" required th:field="*{airlineName}">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Country</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-globe2"></i></span>
                <input type="text" name="country" class="form-control border-start-0" placeholder="e.g., Myanmar" required th:field="*{country}">
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label text-uppercase fw-bold">Airline Logo</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-image"></i></span>
                <input type="file" name="photoFile" class="form-control border-start-0" accept="image/*">
              </div>
              <div class="form-text mt-1 text-muted small">PNG or JPG preferred. Max size 2MB.</div>
              
              <div th:if="${airline.logo != null}" class="mt-2">
              	<span class="small text-muted">Current Logo: </span>
              	<img th:src="@{'/photos/'+${airline.logo}}" width="40" height="30" class="rounded border" />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <a th:href="@{/airline/admin/airlines}" class="btn btn-light rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm" th:text="${airline.airlineId != 0} ? 'Update Airline' : 'Save Airline'">Save Airline</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
