<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airport Administration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
	background-color: #f4f7f6;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
}

.modal-content {
	border: none;
	box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
	background-color: #ffffff;
}

.modal-header {
	border-bottom: 1px solid #edf2f7;
	background-color: #fafbfc;
	padding: 1.5rem;
}

.modal-title {
	color: #1a202c;
	font-size: 1.25rem;
}

.modal-body {
	padding: 2rem 1.5rem;
}

.form-label {
	color: #4a5568;
	margin-bottom: 0.5rem;
	font-size: 0.85rem;
	letter-spacing: 0.3px;
}

.form-control, .form-select {
	border: 1.5px solid #e2e8f0;
	padding: 0.75rem 1rem;
	border-radius: 8px;
	font-size: 0.95rem;
	color: #2d3748;
	transition: all 0.2s ease-in-out;
}

.form-control:focus, .form-select:focus {
	border-color: #3182ce;
	box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
	background-color: #fff;
}

.form-control::placeholder {
	color: #a0aec0;
	font-size: 0.9rem;
}

.btn-primary {
	background-color: #3182ce;
	border: none;
	font-weight: 500;
	transition: all 0.2s ease;
}

.btn-primary:hover {
	background-color: #2b6cb0;
	transform: translateY(-1px);
}

.btn-light {
	background-color: #edf2f7;
	color: #4a5568;
	border: none;
	font-weight: 500;
}

.btn-light:hover {
	background-color: #e2e8f0;
	color: #2d3748;
}

.modal-footer {
	border-top: 1px solid #edf2f7;
	background-color: #fafbfc;
	padding: 1.25rem 1.5rem;
}
</style>
</head>

	<div class="w-100" style="max-width: 500px;">

			<div class="modal-content rounded-4">
				<div class="modal-header d-flex align-items-center">

						<i class="bi bi-geo-alt-fill text-primary me-2"></i> 
						<span th:text="${airport.airportId != 0} ? 'Update Airport Terminal' : 'Register New Airport Terminal'">Register New Airport Terminal</span>
					</h5>
					<a th:href="@{/airline/admin/airports}" class="btn-close" aria-label="Close"></a>
				</div>
        
        <form 
        th:action="@{/airline/admin/airport}" 
        th:object="${airport}" 
        method="post"
        enctype="multipart/form-data">
        
         <input type="hidden" th:field="*{airportId}" />
          <div class="modal-body">

							<label class="form-label small fw-bold">Airport Name</label> 
							<input type="text" name="airportName" class="form-control border-start-0" placeholder="e.g., Yangon International Airport" required th:field="*{airportName}">

							</select> -->
						</div>

						
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">City Location</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                <input type="text" name="city" class="form-control border-start-0" placeholder="e.g., Yangon" required th:field="*{city}">
              </div>
            </div>
            
            <!-- Airport Image -->
           <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Airport Image</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-image"></i></span>
                <input type="file" name="photoFile" class="form-control border-start-0" accept="image/*">
              </div>
              <div class="form-text mt-1 text-muted small">PNG or JPG preferred. Max size 2MB.</div>
              
              <div th:if="${airport.image != null}" class="mt-2">
              	<span class="small text-muted">Current Image: </span>
              	<img th:src="@{'/photos/'+${airport.image}}" width="40" height="30" class="rounded border" />
              </div>
            </div>

          </div>
          
          

          <div class="modal-footer">
            <a th:href="@{/airline/admin/airports}" class="btn btn-light rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm" th:text="${airport.airportId != null} ? 'Update Airport' : 'Save Airport'">Save Airport</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
