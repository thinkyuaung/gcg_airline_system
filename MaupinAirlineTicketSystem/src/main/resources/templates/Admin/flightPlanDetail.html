<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flight Plan Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background: #f4f7fb; font-family: 'Segoe UI', sans-serif; }
        .detail-card { border: none; border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,.08); overflow: hidden; }
        .detail-header { background: linear-gradient(135deg, #0057D9, #3A86FF); color: white; padding: 22px 26px; }
        .detail-body { padding: 26px; }
        .section-title { font-size: 16px; font-weight: 700; margin: 26px 0 14px; color: #1f2937; }
        .section-title:first-child { margin-top: 0; }
        .info-label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 600; }
        .info-value { font-size: 15px; font-weight: 600; color: #1f2937; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{Fragments/header :: navbar}"></div>

<div class="container py-4">
    <div class="card detail-card">
        <div class="detail-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-range me-2"></i>Flight Plan Detail</h4>
               <!--  <small class="opacity-75">Flight Plan ID: <span th:text="${flightPlan.flightPlanId}"></span></small> -->
            </div>
            <span class="badge bg-light text-dark fs-6"
                  th:text="${flightPlan.flight != null ? flightPlan.flight.flightNumber : 'No Flight'}"></span>
        </div>

        <div class="detail-body">

            <!-- Flight -->
            <div class="section-title"><i class="bi bi-airplane me-2"></i>Flight</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="info-label">Flight Number</div>
                    <div class="info-value" th:text="${flightPlan.flight != null ? flightPlan.flight.flightNumber : 'N/A'}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Airline</div>
                    <div class="info-value" th:text="${flightPlan.flight != null and flightPlan.flight.airline != null ? flightPlan.flight.airline.airlineName : 'N/A'}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Flight Date</div>
                    <div class="info-value" th:text="${flightPlan.flight_date != null ? #dates.format(flightPlan.flight_date, 'yyyy-MM-dd') : 'N/A'}"></div>
                </div>
            </div>

            <!-- Route -->
            <div class="section-title"><i class="bi bi-signpost-split me-2"></i>Route</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="info-label">Departure Airport</div>
                    <div class="info-value" th:text="${flightPlan.departureAirport != null ? (flightPlan.departureAirport.airportName + ' (' + flightPlan.departureAirport.airportCode + ')') : 'N/A'}"></div>
                </div>
                <div class="col-md-6">
                    <div class="info-label">Arrival Airport</div>
                    <div class="info-value" th:text="${flightPlan.arrivalAirport != null ? (flightPlan.arrivalAirport.airportName + ' (' + flightPlan.arrivalAirport.airportCode + ')') : 'N/A'}"></div>
                </div>
            </div>

            <!-- Schedule -->
            <div class="section-title"><i class="bi bi-clock me-2"></i>Schedule</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="info-label">Departure Time</div>
                    <div class="info-value" th:text="${flightPlan.departureTime != null ? #temporals.format(flightPlan.departureTime, 'yyyy-MM-dd HH:mm') : 'N/A'}"></div>
                </div>
                <div class="col-md-6">
                    <div class="info-label">Arrival Time</div>
                    <div class="info-value" th:text="${flightPlan.arrivalTime != null ? #temporals.format(flightPlan.arrivalTime, 'yyyy-MM-dd HH:mm') : 'N/A'}"></div>
                </div>
            </div>

            <!-- Seats -->
            <div class="section-title"><i class="bi bi-grid-3x3-gap me-2"></i>Seat Availability</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="info-label">Economy</div>
                    <div class="info-value" th:text="${flightPlan.ecomonySeats}"></div>
                </div>
                <div class="col-md-3">
                    <div class="info-label">Business</div>
                    <div class="info-value" th:text="${flightPlan.businessSeats}"></div>
                </div>
                <div class="col-md-3">
                    <div class="info-label">First Class</div>
                    <div class="info-value" th:text="${flightPlan.firseClassSeats}"></div>
                </div>
                <div class="col-md-3">
                    <div class="info-label">Available</div>
                    <div class="info-value" th:text="${flightPlan.availableSeats}"></div>
                </div>
            </div>

            <!-- Pricing -->
            <div class="section-title"><i class="bi bi-cash-coin me-2"></i>Pricing</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="info-label">Price (USD)</div>
                    <div class="info-value">$<span th:text="${#numbers.formatDecimal(flightPlan.price, 1, 2)}"></span></div>
                </div>
                <div class="col-md-6">
                    <div class="info-label">Promotion</div>
                    <div class="info-value">
                        <span th:if="${flightPlan.promotion != null}" th:text="${flightPlan.promotion.description + ' (' + flightPlan.promotion.percentage + '%)'}"></span>
                        <span th:unless="${flightPlan.promotion != null}" class="text-muted small">No Promotion</span>
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">
                <a th:href="@{/airline/admin/flightPlans}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left"></i> Back to Flight Plans
                </a>
                <a th:href="@{/airline/admin/flightPlan/edit/{id}(id=${flightPlan.flightPlanId})}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-pencil-square"></i> Edit Flight Plan
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
