<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airport Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background: #f4f7fb; font-family: 'Segoe UI', sans-serif; }
        .detail-card { border: none; border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,.08); overflow: hidden; }
        .detail-header { background: linear-gradient(135deg, #0057D9, #3A86FF); color: white; padding: 22px 26px; }
        .detail-body { padding: 26px; }
        .section-title { font-size: 16px; font-weight: 700; margin: 26px 0 14px; color: #1f2937; }
        .section-title:first-child { margin-top: 0; }
        .info-label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 600; }
        .info-value { font-size: 15px; font-weight: 600; color: #1f2937; }
        .image-frame { width: 110px; height: 90px; border-radius: 14px; overflow: hidden; border: 2px solid #0d6efd; background: #f8fafc; display: inline-flex; align-items: center; justify-content: center; }
        .image-frame img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{Fragments/header :: navbar}"></div>

<div class="container py-4">
    <div class="card detail-card">
        <div class="detail-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h4 class="mb-0 fw-bold"><i class="bi bi-geo-alt-fill me-2"></i>Airport Detail</h4>
                <small class="opacity-75">Airport ID: <span th:text="${airport.airportId}"></span></small>
            </div>
        </div>

        <div class="detail-body">

            <div class="section-title"><i class="bi bi-image me-2"></i>Image</div>
            <div th:if="${airport.image != null}" class="image-frame">
                <img th:src="@{'/photos/' + ${airport.image}}" alt="Airport Image">
            </div>
            <span th:unless="${airport.image != null}" class="text-muted small italic">No Image</span>

            <div class="section-title"><i class="bi bi-info-circle me-2"></i>Airport Information</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="info-label">Airport Code</div>
                    <div class="info-value" th:text="${airport.airportCode}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Airport Name</div>
                    <div class="info-value" th:text="${airport.airportName}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">City</div>
                    <div class="info-value" th:text="${airport.city}"></div>
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">
                <a th:href="@{/airline/admin/airports}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left"></i> Back to Airports
                </a>
                <a th:href="@{/airline/admin/airport/edit/{id}(id=${airport.airportId})}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-pencil-square"></i> Edit Airport
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
