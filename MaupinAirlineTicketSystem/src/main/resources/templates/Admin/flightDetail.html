<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flight Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background: #f4f7fb; font-family: 'Segoe UI', sans-serif; }
        .detail-card { border: none; border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,.08); overflow: hidden; }
        .detail-header { background: linear-gradient(135deg, #0057D9, #3A86FF); color: white; padding: 22px 26px; }
        .detail-body { padding: 26px; }
        .section-title { font-size: 16px; font-weight: 700; margin: 26px 0 14px; color: #1f2937; }
        .section-title:first-child { margin-top: 0; }
        .info-label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 600; }
        .info-value { font-size: 15px; font-weight: 600; color: #1f2937; }
        .feature-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{Fragments/header :: navbar}"></div>

<div class="container py-4">
    <div class="card detail-card">
        <div class="detail-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h4 class="mb-0 fw-bold"><i class="bi bi-airplane-engines me-2"></i>Flight Detail</h4>
                <small class="opacity-75">Flight ID: <span th:text="${flight.flightId}"></span></small>
            </div>
            <span class="badge bg-light text-dark fs-6"
                  th:classappend="${flight.status == 'active'} ? 'text-success' : 'text-secondary'"
                  th:text="${flight.status != null ? flight.status : 'N/A'}"></span>
        </div>

        <div class="detail-body">

            <!-- Flight -->
            <div class="section-title"><i class="bi bi-airplane me-2"></i>Flight Information</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="info-label">Flight Number</div>
                    <div class="info-value" th:text="${flight.flightNumber}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Status</div>
                    <div class="info-value" th:text="${flight.status != null ? flight.status : 'N/A'}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Total Seats</div>
                    <div class="info-value" th:text="${flight.totalSeats}"></div>
                </div>
            </div>

            <!-- Airline -->
            <div class="section-title"><i class="bi bi-building me-2"></i>Airline</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="info-label">Airline Name</div>
                    <div class="info-value" th:text="${flight.airline != null ? flight.airline.airlineName : 'N/A'}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Airline Code</div>
                    <div class="info-value" th:text="${flight.airline != null ? flight.airline.airlineCode : 'N/A'}"></div>
                </div>
                <div class="col-md-4">
                    <div class="info-label">Country</div>
                    <div class="info-value" th:text="${flight.airline != null ? flight.airline.country : 'N/A'}"></div>
                </div>
            </div>

            <!-- Seats -->
            <div class="section-title"><i class="bi bi-grid-3x3-gap me-2"></i>Seat Capacity</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="info-label">Economy</div>
                    <div class="info-value" th:text="${flight.ecomonySeats}"></div>
                </div>
                <div class="col-md-3">
                    <div class="info-label">Business</div>
                    <div class="info-value" th:text="${flight.businessSeats}"></div>
                </div>
                <div class="col-md-3">
                    <div class="info-label">First Class</div>
                    <div class="info-value" th:text="${flight.firseClassSeats}"></div>
                </div>
                <div class="col-md-3">
                    <div class="info-label">Total</div>
                    <div class="info-value" th:text="${flight.totalSeats}"></div>
                </div>
            </div>

            <!-- Features -->
            <div class="section-title"><i class="bi bi-stars me-2"></i>Flight Features</div>
            <div class="d-flex flex-wrap gap-2">
                <span class="feature-pill bg-primary-subtle text-primary"
                      th:if="${flight.wifi == 1 or flight.wifi == true}"><i class="bi bi-wifi"></i> WiFi</span>
                <span class="feature-pill bg-warning-subtle text-warning-emphasis"
                      th:if="${flight.meal == 1 or flight.meal == true}"><i class="bi bi-cup-hot-fill"></i> Meal</span>
                <span class="feature-pill bg-success-subtle text-success"
                      th:if="${flight.charging == 1 or flight.charging == true}"><i class="bi bi-battery-charging"></i> Charging</span>
                <span class="feature-pill bg-danger-subtle text-danger"
                      th:if="${flight.entertainment == 1 or flight.entertainment == true}"><i class="bi bi-tv-fill"></i> Entertainment</span>
                <span th:if="${(flight.wifi == 0 or flight.wifi == null) and (flight.meal == 0 or flight.meal == null) and (flight.charging == 0 or flight.charging == null) and (flight.entertainment == 0 or flight.entertainment == null)}"
                      class="text-muted small italic">No Features</span>
            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">
                <a th:href="@{/airline/admin/flights}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left"></i> Back to Flights
                </a>
                <a th:href="@{/airline/admin/flight/edit/{id}(id=${flight.flightId})}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-pencil-square"></i> Edit Flight
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
