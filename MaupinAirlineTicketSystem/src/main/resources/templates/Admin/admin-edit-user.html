<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Edit User</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<div class="container mt-5">

<h2>Edit User</h2>

<form th:action="@{/airline/admin/users/update}"
      th:object="${user}"
      method="post">


<input type="hidden" th:field="*{userId}">


<div class="mb-3">
<label>First Name</label>
<input class="form-control" th:field="*{firstName}">
</div>


<div class="mb-3">
<label>Last Name</label>
<input class="form-control" th:field="*{lastName}">
</div>


<div class="mb-3">
<label>Email</label>
<input class="form-control" th:field="*{email}">
</div>


<div class="mb-3">
<label>Phone</label>
<input class="form-control" th:field="*{phoneNumber}">
</div>



<button class="btn btn-primary">
Update
</button>

<a th:href="@{/airline/admin/dashboard}"
class="btn btn-secondary">
Cancel
</a>


</form>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
