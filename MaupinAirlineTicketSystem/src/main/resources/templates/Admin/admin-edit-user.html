<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Edit User</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

	<div th:replace="~{fragments/header :: header}"></div>


	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-lg-7 col-md-9">

				<div class="card shadow border-0 rounded-4">


					<div class="card-header bg-primary text-white rounded-top-4">

						<h4 class="mb-0">
							<i class="bi bi-pencil-square me-2"></i> Edit User
						</h4>

					</div>



					<div class="card-body p-4">


						<form th:action="@{/airline/admin/users/update}"
							th:object="${user}" method="post">


							<input type="hidden" th:field="*{userId}">



							<div class="row">


								<!-- First Name -->

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold"> First Name </label>


									<div class="input-group">

										<span class="input-group-text"> <i class="bi bi-person"></i>
										</span> <input type="text" class="form-control"
											th:field="*{firstName}" placeholder="Enter first name"
											required>

									</div>


									<div class="text-danger small mt-1"
										th:if="${#fields.hasErrors('firstName')}"
										th:errors="*{firstName}"></div>


								</div>





								<!-- Last Name -->

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold"> Last Name </label>


									<div class="input-group">

										<span class="input-group-text"> <i class="bi bi-person"></i>
										</span> <input type="text" class="form-control"
											th:field="*{lastName}" placeholder="Enter last name" required>

									</div>


									<div class="text-danger small mt-1"
										th:if="${#fields.hasErrors('lastName')}"
										th:errors="*{lastName}"></div>


								</div>


							</div>

							<!-- Passport Number -->
							
							<div class="mb-3">

								<label class="form-label fw-semibold"> Passport Number </label>

								<input type="text" class="form-control" th:field="*{passport}"
									required>

								<div class="text-danger small mt-1"
									th:if="${#fields.hasErrors('passport')}"
									th:errors="*{passport}"></div>

							</div>

							<!-- Date of Birth -->

							<div class="mb-3">

								<label class="form-label fw-semibold"> Date of Birth </label>


								<div class="input-group">

									<span class="input-group-text"> <i
										class="bi bi-calendar"></i>
									</span> <input type="date" class="form-control" th:field="*{dob}"
										th:attr="max=${#dates.format(#dates.createNow(),'yyyy-MM-dd')}">

								</div>


								<div class="text-danger small mt-1"
									th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>


							</div>


							<!-- Email -->


							<div class="mb-3">


								<label class="form-label fw-semibold"> Email Address </label>



								<div class="input-group">


									<span class="input-group-text"> <i
										class="bi bi-envelope"></i>
									</span> <input type="email" class="form-control" th:field="*{email}"
										placeholder="example@email.com" required>


								</div>



								<div class="text-danger small mt-1"
									th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
								</div>



							</div>






							<!-- Phone Number -->


							<div class="mb-4">


								<label class="form-label fw-semibold"> Phone Number </label>



								<div class="input-group">


									<span class="input-group-text"> <i
										class="bi bi-telephone"></i>
									</span> <input type="text" class="form-control"
										th:field="*{phoneNumber}" placeholder="09xxxxxxxxx" required>


								</div>



								<div class="text-danger small mt-1"
									th:if="${#fields.hasErrors('phoneNumber')}"
									th:errors="*{phoneNumber}"></div>



							</div>





							<hr>





							<div class="d-flex justify-content-end gap-2">


								<a th:href="@{/airline/admin/dashboard}"
									class="btn btn-outline-secondary px-4"> <i
									class="bi bi-x-circle me-1"></i> Cancel

								</a>




								<button type="submit" class="btn btn-primary px-4">

									<i class="bi bi-check-circle me-1"></i> Update User

								</button>



							</div>




						</form>


					</div>


				</div>


			</div>


		</div>


	</div>



	<div th:replace="~{fragments/footer :: footer}"></div>



	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
