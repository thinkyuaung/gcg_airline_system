<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airline Administration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      border: none;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
    }

    .modal-header {
      border-bottom: 1px solid #edf2f7;
      background-color: #fafbfc;
      padding: 1.5rem;
    }

    .modal-title {
      color: #1a202c;
      font-size: 1.25rem;
    }

    .modal-body {
      padding: 2rem 1.5rem;
    }

    .form-label {
      color: #4a5568;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .form-control, .form-select {
      border: 1.5px solid #e2e8f0;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #2d3748;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus, .form-select:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
      background-color: #fff;
    }

    .form-control::placeholder {
      color: #a0aec0;
      font-size: 0.9rem;
    }

    .btn-primary {
      background-color: #3182ce;
      border: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #2b6cb0;
      transform: translateY(-1px);
    }

    .btn-light {
      background-color: #edf2f7;
      color: #4a5568;
      border: none;
      font-weight: 500;
    }

    .btn-light:hover {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .modal-footer {
      border-top: 1px solid #edf2f7;
      background-color: #fafbfc;
      padding: 1.25rem 1.5rem;
    }
  </style>
</head>
<body>

  <div>
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header d-flex align-items-center">
          <h5 class="modal-title fw-bold">
            <i class="bi bi-calendar-range-fill text-primary me-2"></i>
            <span th:text="${flightPlan.flightPlanId != 0} ? 'Edit Flight Plan' : 'Add New Flight Plan'">Flight Plan</span>
          </h5>
          <a th:href="@{/airline/admin/flightPlans}" class="btn-close" aria-label="Close"></a>
        </div>
        
        <form th:action="${flightPlan.flightPlanId != 0} ? @{/airline/admin/flightPlan/update} : @{/airline/admin/flightPlan}" 
              th:object="${flightPlan}" method="post">
          
          <input type="hidden" th:field="*{flightPlanId}" />
          
          <div class="modal-body">
            <!-- Flight -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Flight</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-airplane"></i></span>
                <select th:field="*{flight}" class="form-select border-start-0" onchange="onFlightChange(this)">
                  <option value="">Select Flight</option>
                  <option th:each="f : ${flights}" 
                          th:value="${f.flightId}" 
                          th:text="${f.flightNumber}"
                          th:data-economy="${f.ecomonySeats}"
                          th:data-business="${f.businessSeats}"
                          th:data-firstclass="${f.firseClassSeats}"></option>
                </select>
              </div>
              <span class="text-danger small" th:if="${#fields.hasErrors('flight')}" th:errors="*{flight}"></span>
            </div>

            <!-- Departure Airport -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Departure Airport</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                <select th:field="*{departureAirport}" class="form-select border-start-0">
                  <option value="">Select Departure Airport</option>
                  <option th:each="a : ${airports}" 
                          th:value="${a.airportId}" 
                          th:text="${a.airportName}"></option>
                </select>
              </div>
              <span class="text-danger small" th:if="${#fields.hasErrors('departureAirport')}" th:errors="*{departureAirport}"></span>
            </div>

            <!-- Arrival Airport -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Arrival Airport</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt-fill"></i></span>
                <select th:field="*{arrivalAirport}" class="form-select border-start-0">
                  <option value="">Select Arrival Airport</option>
                  <option th:each="a : ${airports}" 
                          th:value="${a.airportId}" 
                          th:text="${a.airportName}"></option>
                </select>
              </div>
              <span class="text-danger small" th:if="${#fields.hasErrors('arrivalAirport')}" th:errors="*{arrivalAirport}"></span>
            </div>

            <!-- Departure Time -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Departure Time</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-clock"></i></span>
                <input type="datetime-local" class="form-control border-start-0" th:field="*{departureTime}">
              </div>
              <span class="text-danger small" th:if="${#fields.hasErrors('departureTime')}" th:errors="*{departureTime}"></span>
            </div>

            <!-- Arrival Time -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Arrival Time</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-clock-fill"></i></span>
                <input type="datetime-local" class="form-control border-start-0" th:field="*{arrivalTime}">
              </div>
              <span class="text-danger small" th:if="${#fields.hasErrors('arrivalTime')}" th:errors="*{arrivalTime}"></span>
            </div>

            <!-- Flight Date -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Flight Date</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                <input type="date" class="form-control border-start-0" th:field="*{flight_date}">
              </div>
              <span class="text-danger small" th:if="${#fields.hasErrors('flight_date')}" th:errors="*{flight_date}"></span>
            </div>

            <!-- Economy Seats -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Economy Seats</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="number" id="ecomonySeats" name="ecomonySeats" class="form-control border-start-0 seat-input" th:field="*{ecomonySeats}" min="0" readonly="readonly">
              </div>
            </div>

            <!-- Business Seats -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Business Seats</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
                <input type="number" id="businessSeats" name="businessSeats" class="form-control border-start-0 seat-input" th:field="*{businessSeats}" min="0" readonly="readonly">
              </div>
            </div>

            <!-- First Class Seats -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">First Class Seats</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-workspace"></i></span>
                <input type="number" id="firseClassSeats" name="firseClassSeats" class="form-control border-start-0 seat-input" th:field="*{firseClassSeats}" min="0" readonly="readonly">
              </div>
            </div>

            <!-- Available Seats (Auto-calculated) -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Available Seats</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-seat"></i></span>
                <input type="number" id="availableSeats" name="availableSeats" class="form-control border-start-0 bg-light" th:field="*{availableSeats}" readonly>
              </div>
            </div>

            <!-- Price -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Price</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-currency-dollar"></i></span>
                <input type="number" step="0.01" class="form-control border-start-0" th:field="*{price}" placeholder="e.g., 250.00">
              </div>
              <span class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <!-- Promotion -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Promotion</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-tag"></i></span>
                <select th:field="*{promotion}" class="form-select border-start-0">
                  <option value="">No Promotion</option>
                  <option th:each="p : ${promotions}" 
                          th:value="${p.promotionId}" 
                          th:text="${p.description} + ' (' + ${p.percentage} + '% off)'"></option>
                </select>
              </div>
            </div>

          </div>
          <div class="modal-footer">
            <a th:href="@{/airline/admin/flightPlans}" class="btn btn-light rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
              <span th:text="${flightPlan.flightPlanId != 0} ? 'Update Flight Plan' : 'Save Flight Plan'">Save</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function onFlightChange(select) {
      var option = select.options[select.selectedIndex];
      if (option.value) {
        document.getElementById('ecomonySeats').value = option.getAttribute('data-economy') || 0;
        document.getElementById('businessSeats').value = option.getAttribute('data-business') || 0;
        document.getElementById('firseClassSeats').value = option.getAttribute('data-firstclass') || 0;
        calculateAvailable();
      }
    }

    document.querySelectorAll('.seat-input').forEach(function(input) {
      input.addEventListener('input', calculateAvailable);
    });

    function calculateAvailable() {
      var economy = parseInt(document.getElementById('ecomonySeats').value) || 0;
      var business = parseInt(document.getElementById('businessSeats').value) || 0;
      var firstClass = parseInt(document.getElementById('firseClassSeats').value) || 0;
      document.getElementById('availableSeats').value = economy + business + firstClass;
    }

    // On page load for edit mode: calculate available from existing values
    window.addEventListener('DOMContentLoaded', function() {
      var e = document.getElementById('ecomonySeats');
      var b = document.getElementById('businessSeats');
      var f = document.getElementById('firseClassSeats');
      if (e && b && f && (e.value || b.value || f.value)) {
        calculateAvailable();
      }
    });
  </script>
</body>
</html>
