<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Issue Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{Fragments/header :: navbar}"></div>

<div class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-3"><i class="bi bi-qr-code text-primary"></i> Issue Booking</h4>

                    <div class="mb-3">
                        <p class="mb-1"><strong>Booking ID:</strong> <span th:text="${booking.bookingId}"></span></p>
                        <p class="mb-1"><strong>Status:</strong> <span th:text="${booking.status}"></span></p>
                        <p class="mb-1"><strong>Passengers:</strong> <span th:text="${booking.passengers}"></span></p>
                        <p class="mb-0"><strong>Total Amount:</strong> <span th:text="${booking.totalAmount}"></span></p>
                    </div>

                    <hr>

                    <form th:action="@{/airline/admin/booking/issue/{id}(id=${booking.bookingId})}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description / Note</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Enter description for this booking..." required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-qr-code"></i> Issue
                            </button>
                            <a th:href="@{/airline/admin/bookings}" class="btn btn-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
