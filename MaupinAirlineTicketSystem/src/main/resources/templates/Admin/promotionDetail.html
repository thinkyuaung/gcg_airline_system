<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Promotion Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background: #f4f7fb; font-family: 'Segoe UI', sans-serif; }
        .detail-card { border: none; border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,.08); overflow: hidden; }
        .detail-header { background: linear-gradient(135deg, #0057D9, #3A86FF); color: white; padding: 22px 26px; }
        .detail-body { padding: 26px; }
        .section-title { font-size: 16px; font-weight: 700; margin: 26px 0 14px; color: #1f2937; }
        .section-title:first-child { margin-top: 0; }
        .info-label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 600; }
        .info-value { font-size: 15px; font-weight: 600; color: #1f2937; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{Fragments/header :: navbar}"></div>

<div class="container py-4">
    <div class="card detail-card">
        <div class="detail-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h4 class="mb-0 fw-bold"><i class="bi bi-tag-fill me-2"></i>Promotion Detail</h4>
                <!-- <small class="opacity-75">Promotion ID: <span th:text="${promotion.promotionId}"></span></small> -->
            </div>
            <span class="badge bg-light text-dark fs-6"
                  th:classappend="${promotion.status == 'Active'} ? 'text-success' : (${promotion.status == 'Inactive'} ? 'text-secondary' : 'text-danger')"
                  th:text="${promotion.status}"></span>
        </div>

        <div class="detail-body">

            <div class="section-title"><i class="bi bi-info-circle me-2"></i>Promotion Information</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="info-label">Description</div>
                    <div class="info-value" th:text="${promotion.description}"></div>
                </div>
                <div class="col-md-6">
                    <div class="info-label">Percentage</div>
                    <div class="info-value"><span th:text="${promotion.percentage}"></span>%</div>
                </div>
            </div>

            <div class="section-title"><i class="bi bi-calendar-event me-2"></i>Validity</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="info-label">Start Date</div>
                    <div class="info-value" th:text="${promotion.startDate != null ? #temporals.format(promotion.startDate, 'yyyy-MM-dd HH:mm') : 'N/A'}"></div>
                </div>
                <div class="col-md-6">
                    <div class="info-label">End Date</div>
                    <div class="info-value" th:text="${promotion.endDate != null ? #temporals.format(promotion.endDate, 'yyyy-MM-dd HH:mm') : 'N/A'}"></div>
                </div>
            </div>

            <div class="section-title"><i class="bi bi-flag me-2"></i>Status</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="info-label">Current Status</div>
                    <div class="info-value" th:text="${promotion.status}"></div>
                </div>
            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">
                <a th:href="@{/airline/admin/promotions}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left"></i> Back to Promotions
                </a>
                <a th:href="@{/airline/admin/promotion/edit/{id}(id=${promotion.promotionId})}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-pencil-square"></i> Edit Promotion
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
