<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotion Administration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      border: none;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
    }

    .modal-header {
      border-bottom: 1px solid #edf2f7;
      background-color: #fafbfc;
      padding: 1.5rem;
    }

    .modal-title {
      color: #1a202c;
      font-size: 1.25rem;
    }

    .modal-body {
      padding: 2rem 1.5rem;
    }

    .form-label {
      color: #4a5568;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .form-control, .form-select {
      border: 1.5px solid #e2e8f0;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #2d3748;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus, .form-select:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
      background-color: #fff;
    }

    .btn-primary {
      background-color: #3182ce;
      border: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #2b6cb0;
      transform: translateY(-1px);
    }

    .btn-light {
      background-color: #edf2f7;
      color: #4a5568;
      border: none;
      font-weight: 500;
    }

    .btn-light:hover {
      background-color: #e2e8f0;
      color: #2d3748;
    }

    .modal-footer {
      border-top: 1px solid #edf2f7;
      background-color: #fafbfc;
      padding: 1.25rem 1.5rem;
    }
  </style>
</head>
<body>

  <div>
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header d-flex align-items-center">
          <h5 class="modal-title fw-bold">
            <i class="bi bi-tag-fill text-primary me-2"></i>
            <span th:text="${promotion.promotionId != 0} ? 'Edit Promotion' : 'Add New Promotion'">Promotion</span>
          </h5>
          <a th:href="@{/airline/admin/promotions}" class="btn-close" aria-label="Close"></a>
        </div>
        
        <form th:action="${promotion.promotionId != 0} ? @{/airline/admin/promotion/update} : @{/airline/admin/promotion}" 
              th:object="${promotion}" method="post">
          
          <input type="hidden" th:field="*{promotionId}" />
          
          <div class="modal-body">
            <!-- Start Date -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Start Date</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                <input type="datetime-local" class="form-control border-start-0" th:field="*{startDate}" required>
              </div>
            </div>

            <!-- End Date -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">End Date</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar-check"></i></span>
                <input type="datetime-local" class="form-control border-start-0" th:field="*{endDate}" required>
              </div>
            </div>

            <!-- Status -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Status</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-toggle-on"></i></span>
                <select class="form-select border-start-0" th:field="*{status}" required>
                  <option value="">Select Status</option>
                  <option value="Active" th:selected="${promotion.status == 'Active'}">Active</option>
                  <option value="Inactive" th:selected="${promotion.status == 'Inactive'}">Inactive</option>
                  <option value="Expired" th:selected="${promotion.status == 'Expired'}">Expired</option>
                </select>
              </div>
            </div>

            <!-- Description -->
            <div class="mb-4">
              <label class="form-label text-uppercase fw-bold">Description</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted align-items-start pt-3"><i class="bi bi-text-paragraph"></i></span>
                <textarea class="form-control border-start-0" th:field="*{description}" rows="3" placeholder="Enter promotion description..." required></textarea>
              </div>
            </div>

          </div>

          <div class="modal-footer">
            <a th:href="@{/airline/admin/promotions}" class="btn btn-light rounded-pill px-4">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
              <span th:text="${promotion.promotionId != 0} ? 'Update Promotion' : 'Save Promotion'">Save</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
