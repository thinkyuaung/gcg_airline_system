<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Airline Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>


<body>

<!-- Shared Header Fragment -->
<div th:replace="~{Fragments/header :: navbar}"></div>





<div class="container py-4">



<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2 class="fw-bold">
<i class="bi bi-speedometer2"></i>Dashboard
</h2>


<p class="text-muted">Maubin International Airline Administration</p>
</div>


<div class="d-flex gap-2">


<a th:href="@{/airline/admin}" class="btn btn-outline-secondary btn-sm rounded-3">
<i class="bi bi-person-badge me-1"></i>
System Admin Dashboard
</a>

<a th:href="@{/airline/admin/add-user}" class="btn btn-outline-primary btn-sm rounded-3">
<i class="bi bi-person-plus me-1"></i>
Add User
</a>


<a th:href="@{/airline/admin/add-admin}" class="btn btn-outline-secondary btn-sm rounded-3">
<i class="bi bi-person-badge me-1"></i>
Add Admin
</a>

<!-- <a th:href="@{/airline/logout}" class="btn btn-outline-danger btn-sm rounded-3">
<i class="bi bi-box-arrow-right me-1"></i>
Logout
</a> -->


</div>


</div>



<div class="row g-4 mb-4">


<!-- Total Users -->
<div class="col-md-3">

<a th:href="@{/airline/admin/users/all}" 
   style="text-decoration:none;">

<div class="card dashboard-card shadow-sm border-0" style="background:#ffffff;">

<div class="card-body">

<i class="bi bi-people-fill fs-2 text-primary"></i>

<h6 class="mt-3 text-muted">
Total Users
</h6>

<h2 class="fw-bold text-dark"
    th:text="${totalUsers}">
0
</h2>

</div>

</div>

</a>

</div>




<!-- Active Users -->
<div class="col-md-3">

<a th:href="@{/airline/admin/users/active}"
   style="text-decoration:none;">

<div class="card dashboard-card shadow-sm border-0"
     style="background:#ffffff;">

<div class="card-body">

<i class="bi bi-check-circle-fill fs-2 text-success"></i>

<h6 class="mt-3 text-muted">
Active Users
</h6>

<h2 class="fw-bold text-dark"
    th:text="${activeUsers}">
0
</h2>

</div>

</div>

</a>

</div>





<!-- Inactive Users -->
<div class="col-md-3">

<a th:href="@{/airline/admin/users/inactive}"
   style="text-decoration:none;">

<div class="card dashboard-card shadow-sm border-0"
     style="background:#ffffff;">

<div class="card-body">

<i class="bi bi-x-circle-fill fs-2 text-danger"></i>

<h6 class="mt-3 text-muted">
Inactive Users
</h6>

<h2 class="fw-bold text-dark"
    th:text="${inactiveUsers}">
0
</h2>

</div>

</div>

</a>

</div>





<!-- Admin Users -->
<div class="col-md-3">

<a th:href="@{/airline/admin/users/admin}"
   style="text-decoration:none;">

<div class="card dashboard-card shadow-sm border-0"
     style="background:#ffffff;">

<div class="card-body">

<i class="bi bi-person-workspace fs-2 text-dark"></i>

<h6 class="mt-3 text-muted">
Admins
</h6>

<h2 class="fw-bold text-dark"
    th:text="${adminUsers}">
0
</h2>

</div>

</div>

</a>

</div>


</div>



<!-- User Table -->


<div class="card shadow-sm border-0 rounded-4">


<div class="card-header bg-white">


<h5 class="fw-bold">

<i class="bi bi-people-fill"></i>

User Management

</h5>


</div>




<div class="card-body">



<div class="table-responsive">


<table class="table table-hover">


<thead class="table-dark">


<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Role</th>

<th>Status</th>

<th class="text-center">
Action
</th>


</tr>


</thead>





<tbody>


<tr th:each="user:${users}">



<td th:text="${user.userId}">
</td>



<td>

<strong th:text="${user.firstName+' '+user.lastName}">
</strong>

</td>



<td th:text="${user.email}">
</td>



<td th:text="${user.phoneNumber}">
</td>




<td>


<span th:if="${user.role == 'SUPERADMIN'}" class="badge bg-dark">
SUPERADMIN
</span>

<span th:if="${user.role == 'ADMIN'}" class="badge bg-primary">
ADMIN
</span>

<span th:if="${user.role == 'USER'}" class="badge bg-success">
USER
</span>


</td>





<td>


<span th:if="${user.status=='active'}"
class="badge bg-success">

Active

</span>



<span th:if="${user.status=='inactive'}"
class="badge bg-danger">

Inactive

</span>


</td>







<td class="text-center">



<a th:href="@{/airline/admin/users/view/{id}(id=${user.userId})}"

class="btn btn-outline-info btn-sm action-btn">


<i class="bi bi-eye"></i>


</a>





<a th:href="@{/airline/admin/users/edit/{id}(id=${user.userId})}"

class="btn btn-outline-warning btn-sm action-btn">


<i class="bi bi-pencil"></i>


</a>




<a th:if="${user.userId != 1 and user.status=='active'}"

th:href="@{/airline/admin/user/delete/{id}(id=${user.userId})}"

class="btn btn-outline-danger btn-sm action-btn">


<i class="bi bi-trash"></i>


</a>



<a th:if="${user.userId != 1 and user.status=='inactive'}"

th:href="@{/airline/admin/user/active/{id}(id=${user.userId})}"

class="btn btn-outline-success btn-sm action-btn">


<i class="bi bi-check-lg"></i>


</a>




</td>



</tr>


</tbody>



</table>



</div>


</div>


</div>


</div>





<div th:replace="~{fragments/footer :: footer}"></div>



</body>
</html>
