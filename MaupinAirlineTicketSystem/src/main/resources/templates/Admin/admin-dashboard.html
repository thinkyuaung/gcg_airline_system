<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Admin Dashboard</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>

body{
    background:#f4f7fb;
}


.dashboard-card{

    border:none;
    border-radius:15px;
    transition:.3s;

}


.dashboard-card:hover{

    transform:translateY(-5px);

}


.table td{

    vertical-align:middle;

}


.action-btn{

    width:38px;
    height:35px;

}


</style>


</head>


<body>


<!-- Header -->

<div th:replace="~{fragments/header :: header}"></div>



<div class="container py-4">



<!-- Header Section -->

<div class="d-flex justify-content-between align-items-center mb-4">


<div>

<h2 class="fw-bold">

<i class="bi bi-speedometer2"></i>

Dashboard

</h2>


<p class="text-muted">

Maubin International Airline Administration

</p>


</div>



<div class="d-flex gap-2">


<a th:href="@{/airline/admin/add-user}"
class="btn btn-primary rounded-pill">

<i class="bi bi-person-plus"></i>

Add User

</a>



<a th:href="@{/airline/admin/add-admin}"
class="btn btn-dark rounded-pill">

<i class="bi bi-person-badge"></i>

Add Admin

</a>



<a th:href="@{/airline/logout}"
class="btn btn-outline-danger rounded-pill">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>


</div>


</div>





<!-- Dashboard Cards -->


<div class="row g-4 mb-4">



<div class="col-md-3">

<div class="card dashboard-card shadow-sm bg-primary text-white">

<div class="card-body">


<i class="bi bi-people-fill fs-2"></i>


<h6 class="mt-3">
Total Users
</h6>


<h2 th:text="${totalUsers}">
0
</h2>


</div>

</div>

</div>




<div class="col-md-3">


<div class="card dashboard-card shadow-sm bg-success text-white">


<div class="card-body">


<i class="bi bi-check-circle-fill fs-2"></i>


<h6 class="mt-3">
Active Users
</h6>


<h2 th:text="${activeUsers}">
0
</h2>


</div>


</div>


</div>





<div class="col-md-3">


<div class="card dashboard-card shadow-sm bg-danger text-white">


<div class="card-body">


<i class="bi bi-x-circle-fill fs-2"></i>


<h6 class="mt-3">
Inactive Users
</h6>


<h2 th:text="${inactiveUsers}">
0
</h2>



</div>


</div>


</div>





<div class="col-md-3">


<div class="card dashboard-card shadow-sm bg-dark text-white">


<div class="card-body">


<i class="bi bi-person-workspace fs-2"></i>


<h6 class="mt-3">
Admins
</h6>


<h2 th:text="${adminUsers}">
0
</h2>


</div>


</div>


</div>


</div>







<!-- Filter Buttons -->


<div class="mb-4">


<a th:href="@{/airline/admin/users/active}"
class="btn btn-success rounded-pill px-4">


<i class="bi bi-check-circle-fill fs-5"></i>


</a>



<a th:href="@{/airline/admin/users/inactive}"
class="btn btn-danger rounded-pill px-4">


<i class="bi bi-x-circle-fill fs-5"></i>


</a>



<a th:href="@{/airline/admin/users/all}"
class="btn btn-primary rounded-pill px-4">


<i class="bi bi-people-fill fs-5"></i>


</a>


</div>







<!-- User Table -->


<div class="card shadow-sm border-0 rounded-4">


<div class="card-header bg-white">


<h5 class="fw-bold">

<i class="bi bi-people-fill"></i>

User Management

</h5>


</div>




<div class="card-body">



<div class="table-responsive">


<table class="table table-hover">


<thead class="table-dark">


<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Role</th>

<th>Status</th>

<th class="text-center">
Action
</th>


</tr>


</thead>





<tbody>


<tr th:each="user:${users}">



<td th:text="${user.userId}">
</td>



<td>

<strong th:text="${user.firstName+' '+user.lastName}">
</strong>

</td>



<td th:text="${user.email}">
</td>



<td th:text="${user.phoneNumber}">
</td>




<td>


<span th:if="${user.role=='ADMIN'}"
class="badge bg-dark">

ADMIN

</span>


<span th:if="${user.role=='USER'}"
class="badge bg-primary">

USER

</span>


</td>





<td>


<span th:if="${user.status=='active'}"
class="badge bg-success">

Active

</span>



<span th:if="${user.status=='inactive'}"
class="badge bg-danger">

Inactive

</span>


</td>







<td class="text-center">



<a th:href="@{/airline/admin/users/view/{id}(id=${user.userId})}"

class="btn btn-outline-info btn-sm action-btn">


<i class="bi bi-eye"></i>


</a>





<a th:href="@{/airline/admin/users/edit/{id}(id=${user.userId})}"

class="btn btn-outline-warning btn-sm action-btn">


<i class="bi bi-pencil"></i>


</a>







<!-- Delete USER + ADMIN -->


<a th:if="${user.userId != 1 and user.status=='active'}"

th:href="@{/airline/admin/user/delete/{id}(id=${user.userId})}"

class="btn btn-outline-danger btn-sm action-btn">


<i class="bi bi-trash"></i>


</a>







<!-- Activate -->


<a th:if="${user.userId != 1 and user.status=='inactive'}"

th:href="@{/airline/admin/user/active/{id}(id=${user.userId})}"

class="btn btn-outline-success btn-sm action-btn">


<i class="bi bi-check-lg"></i>


</a>




</td>



</tr>


</tbody>



</table>



</div>


</div>


</div>


</div>





<div th:replace="~{fragments/footer :: footer}"></div>



</body>

</html>
