<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">

<h2>Admin Dashboard</h2>
<a th:href="@{/airline/logout}" class="btn btn-danger">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>
</div>

<div class="mb-4">

<a th:href="@{/airline/admin/users/all}" class="btn btn-primary rounded-pill px-4">
All
</a>

<a th:href="@{/airline/admin/users/active}" class="btn btn-success rounded-pill px-4">
Active
</a>

<a th:href="@{/airline/admin/users/inactive}" class="btn btn-danger rounded-pill px-4">
Inactive
</a>

</div>

<div class="card shadow rounded-4 p-4">
<h4>User List</h4>
<table class="table table-bordered table-striped mt-3">
<thead class="table-dark">

<tr>
<th>ID</th>
<th>First Name</th>
<th>Last Name</th>
<th>Email</th>
<th>Phone</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>


<tbody>

<tr th:each="user : ${users}">
<td th:text="${user.userId}"></td>
<td th:text="${user.firstName}"></td>
<td th:text="${user.lastName}"></td>
<td th:text="${user.email}"></td>
<td th:text="${user.phoneNumber}"></td>
<td th:text="${user.role}"></td>
<td th:text="${user.status}"></td>

<td>

<a th:href="@{/airline/admin/users/view/{id}(id=${user.userId})}"
class="btn btn-info btn-sm text-white">
View
</a>

<th:block th:if="${user.role.equalsIgnoreCase('USER')}">

<a th:if="${user.status.equalsIgnoreCase('active')}"
th:href="@{/airline/admin/user/delete/{id}(id=${user.userId})}" class="btn btn-danger btn-sm">
Delete
</a>


<a th:if="${user.status.equalsIgnoreCase('inactive')}"
th:href="@{/airline/admin/user/active/{id}(id=${user.userId})}" class="btn btn-success btn-sm">
Activate
</a>


</td>

</tr>

</tbody>
</table>

</div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
