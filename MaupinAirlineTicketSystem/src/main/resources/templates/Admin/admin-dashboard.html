<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
 
    <title>Admin Dashboard - Airline Management</title>
 
 
 
    <!-- Bootstrap 5 CSS -->
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <!-- Bootstrap Icons CDN -->
 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 
    <!-- Custom Style Sheet -->
 
    <link rel="stylesheet" th:href="@{/css/style.css}">
 
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
 

<style>


body{

background:#f8fafc;
font-family:system-ui,-apple-system,sans-serif;

}




.admin-sidebar{

background:#1e293b;

min-height:100vh;

position:fixed;

left:0;

top:0;

width:16.666667%;

padding:25px 15px;

z-index:1000;

transition:0.3s;

}



.sidebar-link{

display:flex;

align-items:center;

gap:12px;

padding:12px 15px;

margin-bottom:8px;

border-radius:10px;

color:#cbd5e1;

text-decoration:none;

font-weight:500;

transition:.3s;

}



.sidebar-link:hover{

background:#0d6efd;

color:white;

}



.sidebar-link.exit {
    color: #dc3545 !important;
}

.sidebar-link.exit i {
    color: #dc3545 !important;
}

.sidebar-link.exit:hover,
.sidebar-link.exit:hover i {
    background: #dc3545 !important;
    color: #ffffff !important;
}

.active-admin {

    background-color:#0d6efd;
    color:#ffffff !important;

    box-shadow:0 4px 12px rgba(13,110,253,0.25);

}


.active-admin:hover {

    background-color:#0b5ed7;

    color:#ffffff !important;

}


.main-content{

margin-left:16.666667%;

width:83.333333%;

padding:30px;

transition:.3s;

}



.sidebar-toggle{

display:none;

}



@media(max-width:768px){

.admin-sidebar{

left:-100%;

width:260px;

}


.admin-sidebar.show{

left:0;

}


.main-content{

margin-left:0;

width:100%;

}




.sidebar-toggle{

display:block;

}



}






.dashboard-card{

border:none;

border-radius:15px;

transition:.3s;

}



.dashboard-card:hover{

transform:translateY(-5px);

}


.highlight-dashboard {

    background-color:#0d6efd !important;

    color:white !important;

    border-radius:10px;

    padding:14px 18px;

    display:flex;

    align-items:center;

    gap:12px;

    font-weight:600;

    box-shadow:0 6px 15px rgba(13,110,253,0.35);

    transition:all 0.3s ease;

    text-decoration:none !important;   

}


.highlight-dashboard i {

    font-size:22px;

}


.highlight-dashboard:hover {

    background-color:#0b5ed7 !important;

    color:white !important;

    transform:translateY(-2px);

    box-shadow:0 8px 20px rgba(13,110,253,0.45);

    text-decoration:none !important;

}

.admin-nav-link {
    text-decoration:none !important;
}


</style>


</head>




<body>





<button class="btn btn-primary sidebar-toggle m-3"
onclick="toggleSidebar()">

<i class="bi bi-list"></i>

Menu

</button>






<nav class="admin-sidebar" id="sidebar">



<div class="text-center mb-4">




<a th:href="@{/airline/}">
						<div th:href="@{/airline/}"
							class="d-inline-flex align-items-center justify-content-center bg-white shadow-sm rounded-circle mb-3 overflow-hidden p-2"
							style="width: 72px; height: 72px; border: 1px solid rgba(186, 230, 253, 0.8);">
							<img th:src="@{/images/Maubin AirLine.png}"
								alt="Maubin AirLine Logo" class="img-fluid"
								style="max-height: 100%; object-fit: contain;">
						</div>
					</a>
				</div>
<div class="d-flex align-items-center gap-2 mb-4 px-2">
					<i class="bi bi-shield-lock-fill text-primary fs-4"></i> <span
						class="fw-bold fs-5 text-white">Super Admin</span>
				</div>






</div>





<hr class="text-white">









<a th:href="@{/airline/}"

class="sidebar-link">

<i class="bi bi-house-door-fill"></i>

Home Page

</a>






<a th:href="@{/airline/admin/add-user}"

class="sidebar-link">

<i class="bi bi-person-plus-fill"></i>

Add User

</a>




<a th:href="@{/airline/admin}"
   class="admin-nav-link highlight-dashboard">

    <i class="bi bi-bar-chart-fill"></i>

    <span>
        Airline Admin Dashboard<br>
        
    </span>

</a>






<a th:href="@{/airline/admin/add-admin}"

class="sidebar-link">

<i class="bi bi-person-badge-fill"></i>

Add Admin

</a>






<hr class="text-white">
















<a th:href="@{/airline/logout}"

class="sidebar-link exit text-danger">

<i class="bi bi-box-arrow-right"></i>

Exit Portal

</a>





</nav>








<div class="main-content">





<div class="d-flex justify-content-between 
align-items-center mb-4 flex-wrap">



<div>


<h2 class="fw-bold">

<i class="bi bi-speedometer2"></i>

Dashboard

</h2>



<p class="text-muted">

Maubin International Airline Administration

</p>


</div>



</div>





<div class="row g-4">



<div class="col-md-3 col-sm-6">


<div class="card dashboard-card shadow-sm">


<div class="card-body">


<i class="bi bi-people-fill fs-2 text-primary"></i>


<h6 class="text-muted mt-3">

Total Users

</h6>


<h2 class="fw-bold"

th:text="${totalUsers}">

0

</h2>


</div>


</div>


</div>





<div class="col-md-3 col-sm-6">


<div class="card dashboard-card shadow-sm">


<div class="card-body">


<i class="bi bi-check-circle-fill fs-2 text-success"></i>


<h6 class="text-muted mt-3">

Active Users

</h6>


<h2 class="fw-bold"

th:text="${activeUsers}">

0

</h2>


</div>


</div>


</div>





<div class="col-md-3 col-sm-6">


<div class="card dashboard-card shadow-sm">


<div class="card-body">


<i class="bi bi-x-circle-fill fs-2 text-danger"></i>


<h6 class="text-muted mt-3">

Inactive Users

</h6>


<h2 class="fw-bold"

th:text="${inactiveUsers}">

0

</h2>


</div>


</div>


</div>





<div class="col-md-3 col-sm-6">


<div class="card dashboard-card shadow-sm">


<div class="card-body">


<i class="bi bi-person-workspace fs-2"></i>


<h6 class="text-muted mt-3">

Admins

</h6>


<h2 class="fw-bold"

th:text="${adminUsers}">

0

</h2>


</div>


</div>


</div>



</div>

s

<div class="card shadow-sm border-0 rounded-4 mt-4">


    <div class="card-header bg-white">

        <h5 class="fw-bold mb-0">

            <i class="bi bi-people-fill"></i>

            User Management

        </h5>

    </div>




    <div class="card-body">


        <div class="table-responsive">


            <table class="table table-hover align-middle">


                <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Role</th>

                        <th>Status</th>

                        <th class="text-center">
                            Action
                        </th>

                    </tr>

                </thead>



                <tbody>


                    <tr th:each="user:${users}">


                        <td th:text="${user.userId}">
                        </td>



                        <td>

                            <strong th:text="${user.firstName+' '+user.lastName}">
                            </strong>

                        </td>




                        <td th:text="${user.email}">
                        </td>




                        <td th:text="${user.phoneNumber}">
                        </td>






                        <td>


                            <span th:if="${user.role=='SUPERADMIN'}"
                            class="badge bg-dark">

                                SUPERADMIN

                            </span>



                            <span th:if="${user.role=='ADMIN'}"
                            class="badge bg-primary">

                                ADMIN

                            </span>




                            <span th:if="${user.role=='USER'}"
                            class="badge bg-success">

                                USER

                            </span>


                        </td>






                        <td>


                            <span th:if="${user.status=='active'}"
                            class="badge bg-success">

                                Active

                            </span>




                            <span th:if="${user.status=='inactive'}"
                            class="badge bg-danger">

                                Inactive

                            </span>


                        </td>







                        <td class="text-center">



                            <!-- View -->

                            <a th:href="@{/airline/admin/users/view/{id}(id=${user.userId})}"

                            class="btn btn-outline-info btn-sm">

                                <i class="bi bi-eye"></i>

                            </a>





                            <!-- Edit -->

                            <a th:href="@{/airline/admin/users/edit/{id}(id=${user.userId})}"

                            class="btn btn-outline-warning btn-sm">

                                <i class="bi bi-pencil"></i>

                            </a>






                            <!-- Delete Active User -->

                            <a th:if="${user.userId != 1 and user.status=='active'}"

                            th:href="@{/airline/admin/user/delete/{id}(id=${user.userId})}"

                            class="btn btn-outline-danger btn-sm">

                                <i class="bi bi-trash"></i>

                            </a>






                            <!-- Activate Inactive User -->

                            <a th:if="${user.userId !=1 and user.status=='inactive'}"

                            th:href="@{/airline/admin/user/active/{id}(id=${user.userId})}"

                            class="btn btn-outline-success btn-sm">

                                <i class="bi bi-check-lg"></i>

                            </a>



                        </td>



                    </tr>



                </tbody>


            </table>


        </div>


    </div>


</div>




</div>






<script>


function toggleSidebar(){


document.getElementById("sidebar")
.classList.toggle("show");


}


</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
