<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Airline Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>

<body class="bg-light">

    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-4">

        <!-- Top Header Controls -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h2 class="fw-bold dashboard-header-title mb-1 text-dark">
                    <i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard Overview
                </h2>
                <p class="text-muted mb-0">Maubin International Airline Administration</p>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/airline/admin/add-user}" class="btn btn-primary btn-sm rounded-3 px-3 shadow-sm">
                    <i class="bi bi-person-plus me-1"></i> Add User
                </a> 
                <a th:href="@{/airline/admin/add-admin}" class="btn btn-outline-secondary btn-sm rounded-3 px-3">
                    <i class="bi bi-person-badge me-1"></i> Add Admin
                </a> 
                <a th:href="@{/airline/logout}" class="btn btn-outline-danger btn-sm rounded-3 px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
            </div>
        </div>

        <!-- Metric KPI Cards -->
        <div class="row g-4 mb-4">

            <!-- Total Users -->
            <div class="col-md-3">
                <a th:href="@{/airline/admin/users/all}" class="text-decoration-none">
                    <div class="card metric-card shadow-sm bg-white">
                        <div class="card-body p-4 d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1 fw-semibold">Total Users</h6>
                                <h2 class="fw-bold text-dark mb-0" th:text="${totalUsers}">0</h2>
                            </div>
                            <div class="metric-icon-wrapper bg-soft-primary">
                                <i class="bi bi-people-fill fs-4"></i>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Active Users -->
            <div class="col-md-3">
                <a th:href="@{/airline/admin/users/active}" class="text-decoration-none">
                    <div class="card metric-card shadow-sm bg-white">
                        <div class="card-body p-4 d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1 fw-semibold">Active Users</h6>
                                <h2 class="fw-bold text-dark mb-0" th:text="${activeUsers}">0</h2>
                            </div>
                            <div class="metric-icon-wrapper bg-soft-success">
                                <i class="bi bi-check-circle-fill fs-4"></i>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Inactive Users -->
            <div class="col-md-3">
                <a th:href="@{/airline/admin/users/inactive}" class="text-decoration-none">
                    <div class="card metric-card shadow-sm bg-white">
                        <div class="card-body p-4 d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1 fw-semibold">Inactive Users</h6>
                                <h2 class="fw-bold text-dark mb-0" th:text="${inactiveUsers}">0</h2>
                            </div>
                            <div class="metric-icon-wrapper bg-soft-danger">
                                <i class="bi bi-x-circle-fill fs-4"></i>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Admin Users -->
            <div class="col-md-3">
                <a th:href="@{/airline/admin/users/admin}" class="text-decoration-none">
                    <div class="card metric-card shadow-sm bg-white">
                        <div class="card-body p-4 d-flex align-items-center justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1 fw-semibold">Admins</h6>
                                <h2 class="fw-bold text-dark mb-0" th:text="${adminUsers}">0</h2>
                            </div>
                            <div class="metric-icon-wrapper bg-soft-dark">
                                <i class="bi bi-person-workspace fs-4"></i>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

        </div>

        <!-- Main User Management Section -->
        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            
            <!-- Header with Search and Filter Bar -->
            <div class="card-header bg-white py-3 px-4 border-bottom d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <h5 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-people-fill me-2 text-primary"></i>User Directory
                </h5>
                
                <!-- Quick Filter Links -->
                <div class="btn-group bg-light p-1 rounded-3">
                    <a th:href="@{/airline/admin/users/all}" class="btn btn-sm btn-white fw-semibold rounded-2 shadow-sm text-dark px-3">All</a>
                    <a th:href="@{/airline/admin/users/active}" class="btn btn-sm text-muted fw-semibold px-3">Active</a>
                    <a th:href="@{/airline/admin/users/inactive}" class="btn btn-sm text-muted fw-semibold px-3">Inactive</a>
                    <a th:href="@{/airline/admin/users/admin}" class="btn btn-sm text-muted fw-semibold px-3">Admins</a>
                </div>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table modern-table align-middle">
                        <thead>
                            <tr>
                                <th class="ps-4">User</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user:${users}">
                                <!-- User Info with Dynamic Initial Avatar -->
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="user-avatar-circle" th:text="${#strings.substring(user.firstName, 0, 1)}">U</div>
                                        <div>
                                            <div class="fw-bold text-dark" th:text="${user.firstName + ' ' + user.lastName}">John Doe</div>
                                            <small class="text-muted" th:text="'ID: #' + ${user.userId}">ID: #1</small>
                                        </div>
                                    </div>
                                </td>

                                <td class="text-secondary" th:text="${user.email}">user@example.com</td>

                                <td class="text-secondary" th:text="${user.phoneNumber}">+95 9...</td>

                                <td>
                                    <span th:if="${user.role=='ADMIN'}" class="badge badge-soft-dark">ADMIN</span> 
                                    <span th:if="${user.role=='USER'}" class="badge badge-soft-primary">USER</span>
                                </td>

                                <td>
                                    <span th:if="${user.status=='active'}" class="badge badge-soft-success">Active</span> 
                                    <span th:if="${user.status=='inactive'}" class="badge badge-soft-danger">Inactive</span>
                                </td>

                                <!-- Action Buttons -->
                                <td class="text-end pe-4">
                                    <div class="d-inline-flex gap-2">
                                        <a th:href="@{/airline/admin/users/view/{id}(id=${user.userId})}"
                                           class="action-btn action-btn-view" title="View Details">
                                            <i class="bi bi-eye"></i>
                                        </a> 
                                        <a th:href="@{/airline/admin/users/edit/{id}(id=${user.userId})}"
                                           class="action-btn action-btn-edit" title="Edit User">
                                            <i class="bi bi-pencil"></i>
                                        </a> 
                                        <a th:if="${user.userId != 1 and user.status=='active'}"
                                           th:href="@{/airline/admin/user/delete/{id}(id=${user.userId})}"
                                           class="action-btn action-btn-delete" title="Deactivate User">
                                            <i class="bi bi-trash"></i>
                                        </a> 
                                        <a th:if="${user.userId != 1 and user.status=='inactive'}"
                                           th:href="@{/airline/admin/user/active/{id}(id=${user.userId})}"
                                           class="action-btn action-btn-activate" title="Activate User">
                                            <i class="bi bi-check-lg"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
