<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Add Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<div class="container mt-5">

<h2>Add New Admin</h2>


<form th:action="@{/airline/admin/add-admin}"
      th:object="${user}"
      method="post">


<div class="mb-3">
<label>First Name</label>
<input class="form-control" th:field="*{firstName}" required>
</div>


<div class="mb-3">
<label>Last Name</label>
<input class="form-control" th:field="*{lastName}" required>
</div>


<div class="mb-3">
<label>Passport</label>
<input class="form-control" th:field="*{passport}" required>
</div>


<div class="mb-3">
<label>Date of Birth</label>
<input type="date" class="form-control" th:field="*{dob}" required>
</div>


<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" th:field="*{email}" required>
</div>


<div class="mb-3">
<label>Phone Number</label>
<input class="form-control" th:field="*{phoneNumber}" required>
</div>


<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" th:field="*{password}" required>
</div>


<button class="btn btn-dark">
Add Admin
</button>


<a th:href="@{/airline/admin/dashboard}"
class="btn btn-secondary">
Cancel
</a>


</form>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
