<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

</head>


<body>


<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<div class="container mt-5 mb-5">
<div class="row justify-content-center">
<div class="col-md-7">
<div class="card shadow-lg rounded-4 p-4">


<h2 class="text-center mb-4">
<i class="bi bi-pencil-square"></i>
Edit Profile
</h2>

<form th:action="@{/airline/profile/update}" th:object="${user}" method="post">

<div class="mb-3">
<label class="form-label">First Name</label>
<input type="text" class="form-control" th:field="*{firstName}" required>
</div>

<div class="mb-3">
<label class="form-label">Last Name</label>
<input type="text" class="form-control" th:field="*{lastName}" required>
</div>

<div class="mb-3">
<label class="form-label">Passport Number</label>
<input type="text" class="form-control" th:field="*{passport}" required>
</div>

<div class="mb-3">
<label class="form-label">Date of Birth</label>
<input type="date" class="form-control" th:field="*{dob}">
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" th:field="*{email}" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="text" class="form-control" th:field="*{phoneNumber}" required>
</div>

<div th:if="${error}" class="alert alert-danger">
<span th:text="${error}"></span>
</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>
<input type="password" name="confirmPassword" class="form-control" placeholder="Enter your current password" required>
<small class="text-muted"> Please enter your current password to save changes.</small>
</div>

<div class="d-flex justify-content-between">
<a th:href="@{/airline/profile}" class="btn btn-secondary">
<i class="bi bi-arrow-left"></i>
Back
</a>

<button type="submit" class="btn btn-primary">
<i class="bi bi-save"></i> 
Update Profile
</button>




</div>
</form>

</div>

</div>

</div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>



</body>
</html>
