<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

</head>


<body>


<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<div class="container mt-5 mb-5">
<div class="row justify-content-center">
<div class="col-md-7">
<div class="card shadow-lg rounded-4 p-4">


<h2 class="text-center mb-4">
<i class="bi bi-pencil-square"></i>
Edit Profile
</h2>

<form th:action="@{/airline/profile/update}" th:object="${user}" method="post">

<div class="mb-3">

<label class="form-label">
    First Name
</label>

<input type="text"
       class="form-control"
       th:field="*{firstName}"
       maxlength="30"
       pattern="[A-Za-z ]+"
       title="First name must contain only letters."
       oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
       required>

<div class="text-danger small"
     th:if="${#fields.hasErrors('firstName')}"
     th:errors="*{firstName}">
</div>

</div>

<div class="mb-3">

<label class="form-label">
    Last Name
</label>

<input type="text"
       class="form-control"
       th:field="*{lastName}"
       maxlength="30"
       pattern="[A-Za-z ]+"
       title="Last name must contain only letters."
       oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')"
       required>

<div class="text-danger small"
     th:if="${#fields.hasErrors('lastName')}"
     th:errors="*{lastName}">
</div>

</div>

<div class="mb-3">
<label class="form-label">Passport Number</label>
<input type="text"
       class="form-control"
       th:field="*{passport}"
       maxlength="12"
       pattern="[A-Za-z0-9]+"
       required>

<div class="text-danger small"
     th:if="${#fields.hasErrors('passport')}"
     th:errors="*{passport}">
</div>
</div>



<div class="mb-3">

<label class="form-label">
    Date of Birth
</label>

<input type="date"
       class="form-control"
       th:field="*{dob}">

<div class="text-danger small"
     th:if="${#fields.hasErrors('dob')}"
     th:errors="*{dob}">
</div>

</div>

<div class="mb-3">

<label class="form-label">
    Phone Number
</label>

<input type="tel"
       class="form-control"
       th:field="*{phoneNumber}"
       maxlength="15"
       pattern="[0-9]{7,15}"
       required>

<div class="text-danger small"
     th:if="${#fields.hasErrors('phoneNumber')}"
     th:errors="*{phoneNumber}">
</div>

<div class="mb-3">

<label class="form-label">
    Email Address
</label>

<input type="email"
       class="form-control"
       th:field="*{email}"
       maxlength="100"
       placeholder="example@email.com"
       required>


<div class="text-danger small"
     th:if="${#fields.hasErrors('email')}"
     th:errors="*{email}">
</div>

</div>
</div>

<div th:if="${error}" class="alert alert-danger">
<span th:text="${error}"></span>
</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>
<input type="password" name="confirmPassword" class="form-control" placeholder="Enter your current password" required>
<small class="text-muted"> Please enter your current password to save changes.</small>
</div>

<div class="d-flex justify-content-between">
<a th:href="@{/airline/profile}" class="btn btn-secondary">
<i class="bi bi-arrow-left"></i>
Back
</a>

<button type="submit" class="btn btn-primary">
    <i class="bi bi-person-check-fill"></i>
    Update Profile
</button>




</div>
</form>

</div>

</div>

</div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>



</body>
</html>
