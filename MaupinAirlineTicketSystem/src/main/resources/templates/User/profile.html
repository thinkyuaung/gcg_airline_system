<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>User Profile</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-5 mb-5">
<div class="row justify-content-center">
<div class="col-lg-8">
<div class="card shadow-lg rounded-4">
<div class="card-header bg-primary text-white text-center">

<h3><i class="bi bi-person-circle"></i> User Profile</h3>
</div>

<div class="card-body">
<table class="table table-bordered">
<tr>
<th width="35%">First Name</th>
<td th:text="${user.firstName}"></td>
</tr>

<tr>
<th>Last Name</th>
<td th:text="${user.lastName}"></td>
</tr>

<tr>
<th>Passport Number</th>
<td th:text="${user.passport}"></td>
</tr>

<tr>
<th>Date of Birth</th>
<td th:text="${user.dob}"></td>
</tr>

<tr>
<th>Email</th>
<td th:text="${user.email}"></td>
</tr>

<tr>
<th>Phone Number</th>
<td th:text="${user.phoneNumber}"></td>
</tr>

<tr>
<th>Account Status</th>
<td><span class="badge bg-success" th:text="${user.status}"></span>
</td>
</tr>
</table>

<div class="text-center mt-4">
<a th:href="@{/airline/profile/edit}" class="btn btn-warning me-2"> Edit Profile </a> 
<a th:href="@{/airline/profile/change-password}" class="btn btn-secondary me-2"> Change Password </a> 
<a th:href="@{/airline/home}" class="btn btn-success me-2">Home </a> 
<a th:href="@{/airline/logout}" class="btn btn-danger">Logout </a>

</div>

</div>
</div>
</div>
</div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
