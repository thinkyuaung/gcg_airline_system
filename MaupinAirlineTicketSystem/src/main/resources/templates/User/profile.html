<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile | Maubin Airline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Modern Styling -->
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0d6efd 0%, #003b95 100%);
            --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: #f4f7fb;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #2c3e50;
        }

        .main-content {
            margin-left: 250px;
            padding: 35px 25px;
            transition: var(--transition-smooth);
        }

        @media (max-width: 991px) {
            .main-content {
                margin-left: 0;
            }
        }

        /* Hero Banner Card */
        .profile-hero-card {
            background: white;
            border: none;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .profile-hero-banner {
            background: var(--primary-gradient);
            height: 160px;
            position: relative;
        }

        .profile-avatar-container {
            margin-top: -65px;
            position: relative;
            display: inline-block;
        }

        .profile-avatar-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            background: #ffffff;
            object-fit: cover;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Detail Cards */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px;
            transition: var(--transition-smooth);
            height: 100%;
        }

        .detail-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }

        .detail-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .detail-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0;
            word-break: break-word;
        }

        /* Action Buttons */
        .action-btn {
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <!-- Insert Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>


<div class="d-flex align-items-center gap-3">
                <!-- Toggle Button for Mobile/Tablet -->
                <button class="btn btn-primary d-lg-none" type="button" onclick="toggleSidebar()">
                    <i class="bi bi-list fs-4"></i>
                </button>
                </div>
    <!-- Main Content Area -->
    <main class="main-content">
        <div class="container-fluid max-width-lg">

            <!-- Hero Section Card -->
            <div class="card profile-hero-card mb-4">
                <div class="profile-hero-banner"></div>
                <div class="card-body text-center px-4 pb-4 pt-0">
                    
                    <!-- Avatar & Primary Info -->
                    <div class="profile-avatar-container mb-3">
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Passenger Profile" class="profile-avatar-img">
                    </div>

                    <h2 class="fw-bold mb-1" th:text="${user.firstName + ' ' + user.lastName}">Passenger Name</h2>
                    <p class="text-muted mb-3"><i class="bi bi-envelope me-1"></i><span th:text="${user.email}">user@example.com</span></p>

                    <!-- Account Status Badge -->
                    <div class="mb-4">
                        <span class="status-pill bg-success-subtle text-success border border-success-subtle">
                            <i class="bi bi-patch-check-fill"></i>
                            <span th:text="${user.status}">ACTIVE ACCOUNT</span>
                        </span>
                    </div>

                    <!-- Quick Action Toolbar -->
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a th:href="@{/airline/profile/edit}" class="btn btn-primary action-btn shadow-sm">
                            <i class="bi bi-pencil-square me-1"></i> Edit Profile
                        </a>
                        <a th:href="@{/airline/profile/change-password}" class="btn btn-outline-secondary action-btn">
                            <i class="bi bi-shield-lock me-1"></i> Change Password
                        </a>
                        <a th:href="@{/airline/logout}" class="btn btn-outline-danger action-btn">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </a>
                    </div>

                </div>
            </div>

            <!-- Profile Details Grid -->
            <div class="row g-4">
                
                <!-- Personal Details Section -->
                <div class="col-12">
                    <div class="section-title">
                        <i class="bi bi-person-vcard text-primary fs-4"></i> Personal & Travel Details
                    </div>
                </div>

                <!-- First Name -->
                <div class="col-md-6 col-lg-4">
                    <div class="detail-card d-flex align-items-center gap-3">
                        <div class="detail-icon bg-primary-subtle text-primary">
                            <i class="bi bi-person"></i>
                        </div>
                        <div>
                            <div class="detail-label">First Name</div>
                            <p class="detail-value" th:text="${user.firstName}">N/A</p>
                        </div>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="col-md-6 col-lg-4">
                    <div class="detail-card d-flex align-items-center gap-3">
                        <div class="detail-icon bg-primary-subtle text-primary">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div>
                            <div class="detail-label">Last Name</div>
                            <p class="detail-value" th:text="${user.lastName}">N/A</p>
                        </div>
                    </div>
                </div>

                <!-- Date of Birth -->
                <div class="col-md-6 col-lg-4">
                    <div class="detail-card d-flex align-items-center gap-3">
                        <div class="detail-icon bg-info-subtle text-info">
                            <i class="bi bi-calendar-check"></i>
                        </div>
                        <div>
                            <div class="detail-label">Date of Birth</div>
                            <p class="detail-value" th:text="${user.dob}">N/A</p>
                        </div>
                    </div>
                </div>

                <!-- Passport Number -->
                <div class="col-md-6 col-lg-4">
                    <div class="detail-card d-flex align-items-center gap-3">
                        <div class="detail-icon bg-warning-subtle text-warning">
                            <i class="bi bi-passport"></i>
                        </div>
                        <div>
                            <div class="detail-label">Passport Number</div>
                            <p class="detail-value" th:text="${user.passport}">N/A</p>
                        </div>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="col-md-6 col-lg-4">
                    <div class="detail-card d-flex align-items-center gap-3">
                        <div class="detail-icon bg-success-subtle text-success">
                            <i class="bi bi-envelope-at"></i>
                        </div>
                        <div>
                            <div class="detail-label">Email Address</div>
                            <p class="detail-value" th:text="${user.email}">N/A</p>
                        </div>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="col-md-6 col-lg-4">
                    <div class="detail-card d-flex align-items-center gap-3">
                        <div class="detail-icon bg-danger-subtle text-danger">
                            <i class="bi bi-telephone"></i>
                        </div>
                        <div>
                            <div class="detail-label">Phone Number</div>
                            <p class="detail-value" th:text="${user.phoneNumber}">N/A</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
