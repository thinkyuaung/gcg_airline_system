<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>User Profile</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>

<div th:replace="~{fragments/header :: header}"></div>



<div class="container mt-5 mb-5">


<div class="row justify-content-center">


<div class="col-lg-8">


<div class="card shadow-sm profile-card">



<!-- Profile Header -->

<div class="card-header bg-white text-center">


<h3 class="fw-bold text-dark">

<i class="bi bi-person-circle"></i>

User Profile

</h3>


</div>





<div class="card-body">



<table class="table table-bordered">


<tr>

<th>
First Name
</th>

<td th:text="${user.firstName}">
</td>

</tr>



<tr>

<th>
Last Name
</th>

<td th:text="${user.lastName}">
</td>

</tr>



<tr>

<th>
Passport Number
</th>

<td th:text="${user.passport}">
</td>

</tr>



<tr>

<th>
Date of Birth
</th>

<td th:text="${user.dob}">
</td>

</tr>



<tr>

<th>
Email
</th>

<td th:text="${user.email}">
</td>

</tr>



<tr>

<th>
Phone Number
</th>

<td th:text="${user.phoneNumber}">
</td>

</tr>



<tr>

<th>
Account Status
</th>

<td>

<span class="badge bg-success"
      th:text="${user.status}">
</span>

</td>

</tr>



</table>






<!-- Action Buttons -->


<div class="text-center mt-4">


<a th:href="@{/airline/profile/edit}"
   class="btn btn-outline-primary btn-sm rounded-3 me-2">


<i class="bi bi-pencil me-1"></i>

Edit Profile


</a>




<a th:href="@{/airline/profile/change-password}"
   class="btn btn-outline-secondary btn-sm rounded-3 me-2">


<i class="bi bi-key me-1"></i>

Change Password


</a>


<form th:action="@{/airline/profile/delete}" method="post" class="d-inline">

<button type="button" 
        class="btn btn-outline-danger btn-sm rounded-3 me-2"
        data-bs-toggle="modal"
        data-bs-target="#deleteAccountModal">

<i class="bi bi-trash me-1"></i>
Delete Account


</button>

</form>


<a th:href="@{/airline/logout}"
   class="btn btn-outline-danger btn-sm rounded-3">


<i class="bi bi-box-arrow-right me-1"></i>

Logout


</a>



</div>



</div>


</div>


</div>


</div>


</div>



<div th:replace="~{fragments/footer :: footer}"></div>


<div class="modal fade" id="deleteAccountModal">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Delete Account
                </h5>

                <button type="button" 
                        class="btn-close" 
                        data-bs-dismiss="modal">
                </button>

            </div>



            <form th:action="@{/airline/profile/delete}" method="post">


                <div class="modal-body">

                    <p>
                        Please enter your current password to delete your account.
                    </p>


                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Current Password"
                           required>

                </div>



                <div class="modal-footer">


                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button type="submit"
                            class="btn btn-danger">

                        Delete Account

                    </button>


                </div>


            </form>


        </div>

    </div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
