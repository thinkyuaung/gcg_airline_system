<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airline Ticket Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Main Wrapper with Padding for Fixed Navbar & Flex Grow for Sticky Footer -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 mt-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-lg rounded-4 p-4 border-0">
                        <h2 class="text-center mb-4 fw-bold">Login</h2>

                        <!-- Login Error -->
                        <div th:if="${param.error}" class="alert alert-danger text-center">
                            Invalid Email or Password
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success text-center">
                            You have been logged out.
                        </div>

                        <!-- Spring Security Login Form -->
                        <form th:action="@{/airline/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" name="username" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" name="password" placeholder="Password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mt-2">Sign In</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
