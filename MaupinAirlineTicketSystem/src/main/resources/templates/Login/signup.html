<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Airline Ticket Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Main Wrapper with Padding for Fixed Navbar & Flex Grow for Sticky Footer -->
    <main class="flex-grow-1 py-5 mt-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg rounded-4 p-4 border-0">
                        <h2 class="text-center mb-4 fw-bold">Sign Up</h2>

                        <form th:action="@{/airline/signup}" th:object="${user}" method="post">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">First Name</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Passport Number</label>
                                <input type="text" class="form-control" th:field="*{passport}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Date of Birth</label>
                                <input type="date" class="form-control" th:field="*{dob}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" class="form-control" th:field="*{phoneNumber}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" th:field="*{password}" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mt-2">Create Account</button>
                        </form>

                        <div class="text-center mt-3">Already have an account? 
                            <a th:href="@{/airline/login}" class="text-decoration-none fw-bold">Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
