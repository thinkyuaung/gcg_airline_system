<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Airline Ticket Sign Up</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-5 mb-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card shadow-lg rounded-4 p-4">


<h2 class="text-center mb-4">Sign up</h2>

<form th:action="@{/airline/signup}" th:object="${user}" method="post">


<div class="mb-3">
<label class="form-label">First Name</label>
<input type="text" class="form-control" th:field="*{firstName}" required>
</div>

<div class="mb-3">
<label class="form-label">Last Name</label>
<input type="text" class="form-control" th:field="*{lastName}" required>
</div>

<div class="mb-3">
<label class="form-label">Passport Number</label>
<input type="text" class="form-control" th:field="*{passport}" required>
</div>

<div class="mb-3">
<label class="form-label">Date of Birth</label>
<input type="date" class="form-control" th:field="*{dob}" required>
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" th:field="*{email}" placeholder="name@example.com" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="text" class="form-control" th:field="*{phoneNumber}" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="text" class="form-control" th:field="*{password}" required>
</div>

<button type="submit" class="btn btn-primary w-100 rounded-pill">Create Account</button>
</form>

<div class="text-center mt-3">Already have an account?
<a th:href="@{/airline/login}" class="text-decoration-none fw-bold">Login</a>
</div>

</div>
</div>
</div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div></body>

</html>
