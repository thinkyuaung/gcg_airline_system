<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Airline Ticket Sign Up</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}" />
<link rel="stylesheet" th:href="@{/css/login.css}" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="d-flex flex-column min-vh-100">

	<!-- Header Fragment -->
	<div th:replace="~{fragments/header :: navbar}"></div>

	<!-- Main Wrapper with Cloud Background -->
	<main class="flex-grow-1 auth-container py-4">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-10 col-lg-7 col-xl-6">

					<!-- Glassmorphism Card -->
					<div class="glass-card p-4 p-md-5">
						<!-- Header Title with Official Logo -->
						<div class="text-center mb-4">
							<div
								class="d-inline-flex align-items-center justify-content-center bg-white shadow-sm rounded-circle mb-3 overflow-hidden p-2"
								style="width: 72px; height: 72px; border: 1px solid rgba(186, 230, 253, 0.8);">
								<img th:src="@{/images/Maubin AirLine.png}"
									alt="Maubin AirLine Logo" class="img-fluid"
									style="max-height: 100%; object-fit: contain;">
							</div>
							<h3 class="fw-bold text-dark m-0">Create Account</h3>
							<p class="text-secondary small mt-1">Start your journey with
								Maubin International AirLine</p>
						</div>

						<!-- Sign Up Form (Backend Model preserved) -->
						<form th:action="@{/airline/signup}" th:object="${user}"
							method="post">

							<input type="hidden" name="pendingFlightPlanId"
								th:value="${pendingFlightPlanId}" /> <input type="hidden"
								name="pendingPassengers" th:value="${pendingPassengers}" /> <input
								type="hidden" name="pendingSeatClass"
								th:value="${pendingSeatClass}" />

							<!-- First Name & Last Name -->
							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label small fw-semibold text-secondary">First
										Name</label> <input type="text" class="form-control glass-input"
										th:field="*{firstName}" placeholder="John" required
										maxlength="30">

									<div class="text-danger small mt-1"
										th:if="${#fields.hasErrors('firstName')}"
										th:errors="*{firstName}"></div>
								</div>

								<div class="col-md-6">
									<label class="form-label small fw-semibold text-secondary">Last
										Name</label> <input type="text" class="form-control glass-input"
										th:field="*{lastName}" placeholder="Doe" required
										maxlength="30">

									<div class="text-danger small mt-1"
										th:if="${#fields.hasErrors('lastName')}"
										th:errors="*{lastName}"></div>
								</div>
							</div>

							<!-- Passport & Date of Birth -->
							<div class="row g-3 mb-3">

								<div class="col-md-6">
									<label class="form-label small fw-semibold text-secondary">
										Passport Number </label> <input type="text"
										class="form-control glass-input" th:field="*{passport}"
										placeholder="N1234567" required maxlength="20">
									<div class="text-danger small mt-1"
										th:if="${#fields.hasErrors('passport')}"
										th:errors="*{passport}"></div>
								</div>

								<div class="col-md-6">
									<label class="form-label small fw-semibold text-secondary">
										Date of Birth </label> <input type="date"
										class="form-control glass-input" th:field="*{dob}"
										th:attr="max=${#dates.format(#dates.createNow(),'yyyy-MM-dd')}"
										required>

									<div class="text-danger small mt-1"
										th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}">
									</div>
								</div>

							</div>

							<!-- Email Address -->
							<div class="mb-3">
								<label class="form-label small fw-semibold text-secondary">Email
									Address</label> <input type="email" class="form-control glass-input"
									th:field="*{email}" placeholder="name@example.com" required>

								<div class="text-danger small mt-1"
									th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
								</div>
							</div>

							<!-- Phone Number -->
							<div class="mb-3">
								<label class="form-label small fw-semibold text-secondary">Phone
									Number</label> <input type="text" class="form-control"
									th:field="*{phoneNumber}" placeholder="09xxxxxxxxx"
									maxlength="15" pattern="[0-9]+"
									title="Phone number must contain only numbers" required>


								<div class="text-danger small mt-1"
									th:if="${#fields.hasErrors('phoneNumber')}"
									th:errors="*{phoneNumber}"></div>
							</div>

							<!-- Password -->
							<div class="mb-4">
								<label class="form-label small fw-semibold text-secondary">Password</label>
								<input type="password" class="form-control glass-input"
									th:field="*{password}" placeholder="••••••••" required>
							</div>

							<!-- Submit Button -->
							<button type="submit" class="btn btn-glass-primary w-100 mb-3">Create
								Account</button>
						</form>

						<!-- Footer Links -->
						<div class="text-center mt-2">
							<span class="small text-secondary">Already have an
								account? </span> <a th:href="@{/airline/login}"
								class="small text-decoration-none fw-bold text-primary">Login</a>
						</div>

					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- Footer Fragment -->
	<div th:replace="~{fragments/footer :: footer}"></div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
