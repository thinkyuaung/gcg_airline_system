<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maubin AirLine — Login & Sign Up</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --primary-color: #0ea5e9;
      --primary-hover: #0284c7;
    }
    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 🗂️ Flat Minimalist Card (No Box Shadow) */
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 2.5rem;
      width: 100%;
      max-width: 450px;
    }
    .auth-title {
      color: #0f172a;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    
    .form-control:focus, .input-group-text:focus {
      border-color: var(--primary-color) !important;
      box-shadow: none !important;
      background-color: #ffffff !important;
    }
    .btn-auth-submit {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      font-weight: 700;
      transition: background-color 0.2s ease;
    }
    .btn-auth-submit:hover, .btn-auth-submit:focus, .btn-auth-submit:active {
      background-color: var(--primary-hover) !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }
    
    .nav-pills .nav-link {
      color: #64748b;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .nav-pills .nav-link.active {
      background-color: var(--primary-color) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon d-inline-flex align-items-center justify-content-center text-white rounded-circle p-2 mb-2" style="width: 45px; height: 45px; background-color: var(--primary-color) !important;">
        <i class="bi bi-airplane-fill fs-5"></i>
      </div>
      <h4 class="auth-title">Welcome to Maubin AirLine</h4>
      <p class="text-muted small">Maubin International AirLine</p>
    </div>

    <ul class="nav nav-pills nav-justified mb-4 bg-light p-1 rounded-3" id="authTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active py-2" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginForm" type="button" role="tab" aria-controls="loginForm" aria-selected="true">Login</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link py-2" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signupForm" type="button" role="tab" aria-controls="signupForm" aria-selected="false">Sign Up</button>
      </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
      
      <div class="tab-pane fade show active" id="loginForm" role="tabpanel" aria-labelledby="login-tab">
        <form th:action="@{/airline/login}" method="POST"> 
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Email Address</label>
            <div class="input-group border rounded-3 overflow-hidden">
              <span class="input-group-text bg-light text-muted border-0"><i class="bi bi-envelope"></i></span>
              <input type="email" name="username" class="form-control bg-light border-0 p-2" placeholder="name@example.com" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Password</label>
            <div class="input-group border rounded-3 overflow-hidden">
              <span class="input-group-text bg-light text-muted border-0"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control bg-light border-0 p-2" placeholder="••••••••" required />
            </div>
          </div>
          <button type="submit" class="btn btn-auth-submit w-100 py-2.5 rounded-pill mt-2">Sign In</button>
        </form>
      </div>

      <div class="tab-pane fade" id="signupForm" role="tabpanel" aria-labelledby="signup-tab">
        <form th:action="@{/register}" method="POST">
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Full Name</label>
            <input type="text" name="name" class="form-control bg-light border p-2 rounded-3" placeholder="Enter your full name" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control bg-light border p-2 rounded-3" placeholder="name@example.com" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Phone Number</label>
            <input type="tel" name="phone" class="form-control bg-light border p-2 rounded-3" placeholder="09xxxxxxxxx" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control bg-light border p-2 rounded-3" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-auth-submit w-100 py-2.5 rounded-pill mt-2">Create Account</button>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      
      const urlParams = new URLSearchParams(window.location.search);
      const targetTab = urlParams.get('tab');

      if (targetTab === 'signup') {
        const signupTabButton = document.getElementById('signup-tab');
        if (signupTabButton) {
          const tabTrigger = new bootstrap.Tab(signupTabButton);
          tabTrigger.show();
        }
      }
    });
  </script>
</body>
</html>
