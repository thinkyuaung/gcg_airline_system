<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyNest — Login & Sign Up</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      background-color: var(--gray-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gray-200);
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05);
      padding: 2.5rem;
      width: 100%;
      max-width: 450px;
    }
    .auth-title {
      color: var(--navy);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    
    .btn-auth-submit {
      background-color: #0ea5e9;
      color: var(--blue);
      border: none;
      font-weight: 700;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .btn-auth-submit:hover {
      background-color: #0284c7; 
      color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.4);
    }

    
    .nav-pills .nav-link.active {
      background-color: #0ea5e9 !important; 
      color: var(--white) !important;
    }
    .nav-pills .nav-link {
      color: var(--gray-600);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon d-inline-flex align-items-center justify-content-center text-white rounded-circle p-2 mb-2" style="width: 45px; height: 45px; background-color: #0ea5e9 !important;">
        <i class="bi bi-airplane-fill fs-5"></i>
      </div>
      <h4 class="auth-title">Welcome to Maubin AirLine</h4>
      <p class="text-muted small">Maubin International AirLine</p>
    </div>

    <ul class="nav nav-pills nav-justified mb-4 bg-light p-1 rounded-3" id="authTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active py-2" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginForm" type="button" role="tab" aria-controls="loginForm" aria-selected="true">Login</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link py-2" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signupForm" type="button" role="tab" aria-controls="signupForm" aria-selected="false">Sign Up</button>
      </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
      
      <div class="tab-pane fade show active" id="loginForm" role="tabpanel" aria-labelledby="login-tab">
        <form action="dashboard.html" method="GET"> 
         <div class="mb-3">
            <label class="form-label text-secondary small font-weight-600">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control bg-light border-start-0" placeholder="name@example.com" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small font-weight-600">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control bg-light border-start-0" placeholder="" required />
            </div>
          </div>
          <button type="submit" class="btn btn-auth-submit w-100 py-2.5 rounded-3 mt-2">Sign In</button>
        </form>
      </div>

      <div class="tab-pane fade" id="signupForm" role="tabpanel" aria-labelledby="signup-tab">
        <form action="dashboard.html" method="GET">
          <div class="mb-3">
            <label class="form-label text-secondary small">Full Name</label>
            <input type="text" class="form-control bg-light" placeholder="" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small">Email Address</label>
            <input type="email" class="form-control bg-light" placeholder="name@example.com" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small">Phone Number</label>
            <input type="tel" class="form-control bg-light" placeholder="" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small">Password</label>
            <input type="password" class="form-control bg-light" placeholder="" required />
          </div>
          <button type="submit" class="btn btn-auth-submit w-100 py-2.5 rounded-3 mt-2">Create Account</button>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      
      const urlParams = new URLSearchParams(window.location.search);
      const targetTab = urlParams.get('tab');

      if (targetTab === 'signup') {
        const signupTabButton = document.getElementById('signup-tab');
        if (signupTabButton) {
          const tabTrigger = new bootstrap.Tab(signupTabButton);
          tabTrigger.show();
        }
      }
    });
    
    
 
  </script>
</body>
</body>
</html>
