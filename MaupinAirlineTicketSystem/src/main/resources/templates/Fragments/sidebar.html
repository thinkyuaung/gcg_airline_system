<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="sidebar">

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Base Sidebar Styling */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #1e293b;
            color: #ffffff;
            padding-top: 24px;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
            z-index: 1050;
            transition: transform 0.3s ease-in-out;
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.85rem 1.25rem;
            color: #94a3b8 !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            margin: 4px 14px;
        }

        .sidebar a:hover, .sidebar a.active {
            background: #0d6efd !important;
            color: #ffffff !important;
        }

        .sidebar a.logout.text-danger {
            color: #f87171 !important;
        }

        .sidebar a.logout.text-danger:hover {
            background-color: #dc3545 !important;
            color: #ffffff !important;
        }

        /* Overlay Background when Sidebar is active on small screens */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1040;
        }

        /* Hide Sidebar on screens smaller than 992px */
        @media (max-width: 991.98px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0) !important;
            }

            .sidebar-overlay.show {
                display: block;
            }
        }
    </style>

    <!-- Overlay Backdrop -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Element -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <i class="bi bi-airplane-engines text-primary"></i> 
            <span>Maubin Airline</span>
        </div>
        
        <hr class="border-secondary opacity-25 mx-3 my-3">

        <a th:href="@{/airline/}" class="nav-link-item">
            <i class="bi bi-house"></i> Home
        </a>

        <a th:href="@{/airline/dashboard}" class="nav-link-item">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <a th:href="@{/airline/history}" class="nav-link-item">
            <i class="bi bi-ticket-perforated"></i> Booking History
        </a>

        <a th:href="@{/airline/profile}" class="nav-link-item">
            <i class="bi bi-person"></i> Profile
        </a>
        
        <hr class="border-secondary opacity-25 mx-3 my-3">
        
        <a th:href="@{/logout}" class="logout text-danger">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>

    <!-- Toggle Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll(".sidebar .nav-link-item");

            navLinks.forEach(link => {
                const linkPath = link.getAttribute("href");
                if (linkPath && currentPath.endsWith(linkPath)) {
                    link.classList.add("active");
                } else if (linkPath !== "/airline/" && currentPath.includes(linkPath)) {
                    link.classList.add("active");
                }
            });

            const overlay = document.getElementById("sidebarOverlay");
            const sidebar = document.getElementById("sidebar");

            if (overlay) {
                overlay.addEventListener("click", function () {
                    sidebar.classList.remove("show");
                    overlay.classList.remove("show");
                });
            }
        });

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            if (sidebar && overlay) {
                sidebar.classList.toggle("show");
                overlay.classList.toggle("show");
            }
        }
    </script>

</div>

</body>
</html>
