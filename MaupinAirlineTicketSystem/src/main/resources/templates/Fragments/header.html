<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	rel="stylesheet">


<style>
body {
	font-family: Arial, sans-serif;
	background: #f8f9fa;
}

/* Navbar */
.navbar-custom {
	background: white;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.brand-icon {
	width: 40px;
	height: 40px;
	border-radius: 50%;
	background: #0d6efd;
	color: white;
	display: flex;
	justify-content: center;
	align-items: center;
}

.btn-signup {
	background: #0d6efd;
	color: white;
	border-radius: 25px;
	padding: 8px 20px;
}
</style>


</head>


<body>

<nav th:fragment="header" class="navbar navbar-expand-lg navbar-custom">

<div class="container">

<a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/airline/}">
<div class="brand-icon">
<i class="bi bi-airplane-fill"></i>
</div>
<span>Maubin International Airline</span>
</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav mx-auto"></ul>

<div>
<a class="btn btn-outline-primary rounded-pill" th:href="@{/airline/login}"> Login </a> 
<a class="btn-signup text-decoration-none ms-2" th:href="@{/airline/signup}"> Sign Up </a>
</div>


</div>
</div>
</nav>


</body>
</html>
