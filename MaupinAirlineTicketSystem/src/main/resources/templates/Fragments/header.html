  <!-- NAVBAR -->
 
    <nav id="mainNav"  th:fragment="header" class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <!-- Brand -->
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/airline/}">
                <div class="brand-icon">
                    <i class="bi bi-airplane-fill"></i>
                </div> Maubin International AirLine
            </a>

            <!-- Toggler -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links -->
            <div class="collapse navbar-collapse" id="navMenu">   
                <ul class="navbar-nav mx-auto gap-lg-4 gap-2 mt-3 mt-lg-0">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/airline/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/airline/flights}">Flights</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/airline/about}">About</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/airline/support}">Support</a></li>
                </ul>  

                <!-- Right -->
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <div class="nav-search d-none d-md-flex me-1">
                        <i class="bi bi-search text-secondary"></i>
                        <input type="text" placeholder="Search..." />
                    </div>

                    <!-- Login -->
                    <a th:href="@{/airline/login}" class="btn btn-outline-primary px-3 fw-bold rounded-pill">
                        <i class="bi bi-person"></i> Login
                    </a>
                    <!-- Sign up -->
                    <a th:href="@{/airline/signup}" class="btn-signup px-3 text-decoration-none">
                        <i class="bi bi-person-plus-fill"></i> Sign Up
                    </a>
                </div>
            </div>
        </div>
    </nav>
