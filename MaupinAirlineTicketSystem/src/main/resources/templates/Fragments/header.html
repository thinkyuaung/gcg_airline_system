 <!-- MAIN NAVBAR WITH STICKY TOP EFFECT -->
<nav id="mainNav" th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom py-2 sticky-top shadow-sm">
    <div class="container">
        
        <!-- BRAND LOGO -->
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/airline/index}">
            <div class="brand-icon">
                <img th:src="@{/images/Maubin AirLine.png}" alt="Maubin AirLine Logo" class="brand-logo-img">
            </div> 
            <span class="fw-bold text-dark fs-5">Maubin International AirLine</span>
        </a>

        <!-- MOBILE TOGGLER -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAV LINKS & BUTTONS -->
        <div class="collapse navbar-collapse" id="navMenu">   
            
            <!-- NAV LINKS WITH DYNAMIC THYMELEAF ACTIVE STATE -->
            <ul class="navbar-nav mx-auto gap-lg-4 gap-2 mt-3 mt-lg-0 fw-semibold">
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/airline/'} ? 'active' : ''" 
                       th:href="@{/airline/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/airline/flights')} ? 'active' : ''" 
                       th:href="@{/airline/flights}">Flights</a>
                </li>
                 <li class="nav-item">
                    <a class="nav-link" 
          				 th:href="@{/airline/manage-booking}">Manage Booking</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/airline/about')} ? 'active' : ''" 
                       th:href="@{/airline/about}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" 
                       th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/airline/support')} ? 'active' : ''" 
                       th:href="@{/airline/support}">Support</a>
                </li>
            </ul>

            <!-- Right Controls Container with spacing gap -->
            <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0 ms-lg-auto">
                
                <!-- Clean Search Bar Container -->
               <!-- <!--  <div class="search-box-wrapper d-none d-md-block">
                    <i class="bi bi-search search-icon"></i>

                        type="text"

                    />
                </div> --> 

                <!-- <!-- Login Button -->
               <!--  <a th:href="@{/airline/login}" class="btn btn-outline-primary px-3 fw-bold rounded-pill ms-2">
                    <i class="bi bi-person me-1"></i> Login
                </a>
                
                Sign Up Button
                <a th:href="@{/airline/signup}" class="btn btn-primary px-3 fw-bold rounded-pill">
                    <i class="bi bi-person-plus-fill me-1"></i> Sign Up
                </a> --> 
                
                <!-- Login Button (shown when NOT logged in) -->
    <a th:if="${session.loginUserName == null}" th:href="@{/airline/login}" class="btn btn-outline-primary px-3 fw-bold rounded-pill ms-2">
        <i class="bi bi-person me-1"></i> Login
    </a>
    
    <!-- Sign Up Button (shown when NOT logged in) -->
    <a th:if="${session.loginUserName == null}" th:href="@{/airline/signup}" class="btn btn-primary px-3 fw-bold rounded-pill">
        <i class="bi bi-person-plus-fill me-1"></i> Sign Up
    </a>

    <!-- Logged-in user: person icon, username, dashboard icon, logout -->
    <div th:if="${session.loginUserName != null}" class="d-flex align-items-center gap-3 ms-2">
        <div class="d-flex align-items-center gap-2">
            <div class="d-flex align-items-center justify-content-center rounded-circle bg-primary text-white" style="width:34px;height:34px;font-size:16px;">
                <i class="bi bi-person-fill"></i>
            </div>
            <span class="fw-bold text-dark" th:text="${session.loginUserName}">User</span>
        </div>
        <a th:if="${session.loginUserRole == 'ADMIN'}" th:href="@{/airline/admin/dashboard}" class="btn btn-outline-primary btn-sm rounded-pill" title="Dashboard">
            <i class="bi bi-list-ul"></i>
        </a>
        <a th:if="${session.loginUserRole == 'USER'}" th:href="@{/airline/dashboard}" class="btn btn-outline-primary btn-sm rounded-pill" title="Dashboard">
            <i class="bi bi-list-ul"></i>
        </a>
        <a th:href="@{/airline/logout}" class="btn btn-outline-danger btn-sm rounded-pill" title="Logout">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
            </div>

        </div> <!-- Closed collapse navbar-collapse -->
    </div> <!-- Closed container -->
</nav>
 
</body>
    
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Get current URL path
        const currentPath = window.location.pathname;
        
        // Target all navigation links
        const navLinks = document.querySelectorAll('#navMenu .nav-link');

        navLinks.forEach(link => {
            // Remove hardcoded active classes
            link.classList.remove('active');

            // Compare link href attribute with current pathname
            const linkHref = link.getAttribute('href');
            if (linkHref && currentPath === linkHref) {
                link.classList.add('active');
            }
        });
    });
</script>
