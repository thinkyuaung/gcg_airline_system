<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    font-family:'Segoe UI',sans-serif;
}


/* Main Layout */

.payment-section{

    min-height:100vh;

    display:flex;

    align-items:center;

    padding:25px 0;

}


.payment-card{

    background:white;

    border-radius:22px;

    padding:25px 35px;

    box-shadow:0 15px 40px rgba(0,0,0,.08);

}


/* Header */

.payment-header h2{

    font-weight:700;

}



/* Payment Method */

.method-card{

    height:55px;

    border:1px solid #dee2e6;

    border-radius:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    transition:.25s;

}


.method-card:hover{

    border-color:#0d6efd;

    transform:translateY(-2px);

}


.method-card.active{

    background:#eef5ff;

    border:2px solid #0d6efd;

}



/* Two Main Boxes */

.payment-box{

    min-height:320px;

    border-radius:18px;

    background:#fafcff;

    border:2px dashed #dbe7ff;

    padding:20px;

    text-align:center;

    display:flex;

    flex-direction:column;

}



/* QR Section */

.qr-box{

    justify-content:center;

}


.qr-box img{

    width:130px;

    height:130px;

    object-fit:contain;

    margin:10px auto;

}


#phoneNumber{

    color:#0d6efd;

    font-weight:700;

}



/* Upload Section */

.upload-box{

    justify-content:flex-start;

    gap:8px;

}


.upload-box .bi-cloud-arrow-up{

    font-size:45px;

    color:#0d6efd;

    margin-bottom:5px;

}


.upload-box h4{

    font-size:20px;

    margin:0;

}


.upload-box p{

    margin:0;

}


.upload-box input[type="file"]{

    margin-top:15px !important;

}



/* Submit Button */

.btn-payment{

    width:100%;

    height:48px;

    margin-top:15px;

    border:none;

    border-radius:12px;

    background:#0d6efd;

    color:white;

    font-weight:600;

    font-size:16px;

    transition:.3s;

}


.btn-payment:hover{

    background:#0b5ed7;

}



/* Info Message */

.info-box{

    width:100%;

    background:#fff8e8;

    border-radius:10px;

    padding:10px;

    margin-top:12px;

}


.info-box p{

    margin:0;

    font-size:13px;

    line-height:1.4;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

}


.info-box i{

    color:#d97706;

}



/* Mobile */

@media(max-width:992px){

    .payment-card{

        padding:20px;

    }


    .payment-box{

        margin-bottom:20px;

    }

}

</style>

</head>

<body>

<section class="payment-section">

<div class="container">

<div class="payment-card">

<div class="payment-header d-flex justify-content-between align-items-center mb-3">

    <div>

        <h2>
            <i class="bi bi-credit-card"></i>
            Payment
        </h2>

        <small class="text-muted">
            Choose a payment method
        </small>

    </div>

    <div class="text-end">

        <small>Total Amount</small>

        <h3 class="text-primary fw-bold">

            $
            <span th:text="${payment.amount}"></span>

        </h3>

    </div>

</div>

<h5 class="mb-3">

Choose Payment Method

</h5>

<div class="row g-2 mb-3">

<div class="col-md-4">

<div class="method-card active"

onclick="changePayment('KBZPay',
'09 765 432 100',
'/images/payment/kbz.jpg',this)">

<h5>

KBZPay

</h5>

</div>

</div>

<div class="col-md-4">

<div class="method-card"

onclick="changePayment('AYA Pay',
'09 888 123 456',
'/images/payment/aya.jpg',this)">

<h5>

AYA Pay

</h5>

</div>

</div>

<div class="col-md-4">

<div class="method-card"

onclick="changePayment('CB Pay',
'09 999 456 789',
'/images/payment/cb.jpg',this)">

<h5>

CB Pay

</h5>

</div>

</div>

</div>

<form th:action="@{/airline/payment/upload}"

method="post"

enctype="multipart/form-data">

<input type="hidden"

name="paymentId"

th:value="${payment.paymentId}">

<div class="row">

<!-- LEFT -->

<div class="col-lg-6">

<div class="payment-box qr-box">

<h4 id="walletName">

KBZPay

</h4>

<img id="qrImage"
src="/images/payment/kbz.jpg"
alt="QR Code"
class="rounded">

<h5>

Phone Number

</h5>

<h4 id="phoneNumber">

09 765 432 100

</h4>

<p class="text-muted mt-3">

Scan this QR code or transfer to the phone number above.

</p>

</div>

</div>

<!-- RIGHT -->

<div class="col-lg-6">

<div class="payment-box upload-box">

<i class="bi bi-cloud-arrow-up"></i>

<h4 class="mt-3">

Upload Payment Screenshot

</h4>

<p class="text-muted small mb-2">

PNG or JPG

</p>

<input

type="file"

name="screenshot"

class="form-control"

accept="image/*"

required>

<button type="submit" class="btn-payment">

<i class="bi bi-check-circle me-2"></i>

Submit Payment

</button>

<div class="info-box">

<p class="text-muted small">

<i class="bi bi-info-circle"></i>

Payment verification usually takes 5–10 minutes.

</p>

</div>

</div>

</div>

</form>

</div>

</div>

</section>

<script>

function changePayment(name,phone,image,element){

document.getElementById("walletName").innerHTML=name;

document.getElementById("phoneNumber").innerHTML=phone;

document.getElementById("qrImage").src=image;

document.querySelectorAll(".method-card").forEach(card=>{

card.classList.remove("active");

});

element.classList.add("active");

}

</script>

</body>

</html>
