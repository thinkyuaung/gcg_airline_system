<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:'Segoe UI',sans-serif;
}

.payment-section{
    padding:25px 0;
}

.payment-card{
    background:#fff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.amount-box{
    background:#eef5ff;
    border-radius:15px;
    padding:18px;
    text-align:center;
    margin-bottom:25px;
}

.amount-box h2{
    color:#0d6efd;
    font-weight:700;
}

.method-card{

padding:10px;

height:60px;

display:flex;

justify-content:center;

align-items:center;

font-weight:600;

}

.method-card:hover{

    border-color:#0d6efd;

}

.method-card.active{

    border-color:#0d6efd;

    background:#eef5ff;

}

.qr-box{

    border:2px dashed #0d6efd;

    border-radius:15px;

    padding:25px;

    text-align:center;

    background:#fafcff;

    min-height:370px;

}

.qr-box img{

    width:170px;

    height:170px;

    object-fit:contain;

    margin:20px auto;

}

.upload-box{

    border:2px dashed #0d6efd;

    border-radius:15px;

    padding:30px;

    background:#fafcff;

    text-align:center;

    min-height:370px;

}

.upload-box i{

    font-size:45px;

    color:#0d6efd;

}

.btn-payment{

    width:100%;

    height:55px;

    border:none;

    border-radius:12px;

    background:#0d6efd;

    color:white;

    font-weight:600;

    font-size:17px;

    transition:.3s;

}

.btn-payment:hover{

    background:#0b5ed7;

}

.info-box{

    margin-top:20px;

    background:#fff8e8;

    border-radius:12px;

    padding:15px;

}

@media(max-width:992px){

.qr-box{

margin-bottom:20px;

}

}

</style>

</head>

<body>

<section class="payment-section">

<div class="container-fluid px-lg-5 px-3">

<div class="payment-card">

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>
            <i class="bi bi-credit-card"></i>
            Payment
        </h2>

        <small class="text-muted">
            Choose a payment method
        </small>

    </div>

    <div class="text-end">

        <small>Total Amount</small>

        <h3 class="text-primary fw-bold">

            $
            <span th:text="${payment.amount}"></span>

        </h3>

    </div>

</div>

<h5 class="mb-3">

Choose Payment Method

</h5>

<div class="row mb-4">

<div class="col-md-4">

<div class="method-card active"

onclick="changePayment('KBZPay',
'09 765 432 100',
'/images/payment/kbz.jpg',this)">

<h5>

KBZPay

</h5>

</div>

</div>

<div class="col-md-4">

<div class="method-card"

onclick="changePayment('AYA Pay',
'09 888 123 456',
'/images/payment/aya.jpg',this)">

<h5>

AYA Pay

</h5>

</div>

</div>

<div class="col-md-4">

<div class="method-card"

onclick="changePayment('CB Pay',
'09 999 456 789',
'/images/payment/cb.jpg',this)">

<h5>

CB Pay

</h5>

</div>

</div>

</div>

<form th:action="@{/airline/payment/upload}"

method="post"

enctype="multipart/form-data">

<input type="hidden"

name="paymentId"

th:value="${payment.paymentId}">

<div class="row">

<!-- LEFT -->

<div class="col-lg-6">

<div class="qr-box">

<h4 id="walletName">

KBZPay

</h4>

<img id="qrImage"

src="/images/payment/kbz.jpg"

alt="QR Code">

<h5>

Phone Number

</h5>

<h4 id="phoneNumber">

09 765 432 100

</h4>

<p class="text-muted mt-3">

Scan this QR code or transfer to the phone number above.

</p>

</div>

</div>

<!-- RIGHT -->

<div class="col-lg-6">

<div class="upload-box">

<i class="bi bi-cloud-arrow-up"></i>

<h4 class="mt-3">

Upload Payment Screenshot

</h4>

<p class="text-muted">

PNG or JPG

</p>

<input

type="file"

name="screenshot"

class="form-control mt-3"

accept="image/*"

required>

<button class="btn-payment mt-4">

<i class="bi bi-check-circle"></i>

Submit Payment

</button>

<div class="info-box">

<p class="text-muted mt-3 small">

<i class="bi bi-info-circle"></i>

Payment verification usually takes 5–10 minutes.

</p>

</div>

</div>

</div>

</form>

</div>

</div>

</section>

<script>

function changePayment(name,phone,image,element){

document.getElementById("walletName").innerHTML=name;

document.getElementById("phoneNumber").innerHTML=phone;

document.getElementById("qrImage").src=image;

document.querySelectorAll(".method-card").forEach(card=>{

card.classList.remove("active");

});

element.classList.add("active");

}

</script>

</body>

</html>
