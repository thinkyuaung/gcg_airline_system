<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confirm Cancellation</title>


<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<!-- Fonts same as previous pages -->

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap"
rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/style.css}">


<style>


html,body{

    margin:0;
    padding:0;

}


body{

    background:#faf8ff;

    font-family:'Source Sans 3',sans-serif;

    color:#191b23;

}



h1,h2,h3,h4,h5{

    font-family:'Manrope',sans-serif;

}



.cancel-container{

    min-height:80vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:48px 15px;

}



.cancel-card{

    width:100%;

    max-width:600px;

    background:white;

    border-radius:16px;

    box-shadow:0 .5rem 1.5rem rgba(0,0,0,.08);

    overflow:hidden;

}



.cancel-header{

    background:#fff4f3;

    padding:32px;

    border-bottom:1px solid #ededf9;

}



.warning-icon{

    width:60px;

    height:60px;

    border-radius:50%;

    background:#ffdad6;

    color:#ba1a1a;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

}



.cancel-body{

    padding:32px;

}



.flight-box{

    background:#f3f3fe;

    border-radius:12px;

    padding:20px;

    margin:24px 0;

}



.flight-number{

    color:#004ac6;

    font-size:24px;

    font-weight:700;

}



.route{

    font-size:18px;

    font-weight:600;

}



.refund-box{

    background:rgba(0,74,198,.05);

    border-radius:12px;

    padding:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}



.refund-label{

    color:#737686;

}



.refund-price{

    color:#004ac6;

    font-size:28px;

    font-weight:700;

}



.form-control{

    border-radius:10px;

    padding:14px;

    border-color:#c3c6d7;

}



.btn-danger-custom{

    background:#ba1a1a;

    color:white;

    border:none;

    border-radius:12px;

    padding:14px 24px;

    font-family:'Manrope',sans-serif;

    font-weight:600;

}



.btn-danger-custom:hover{

    background:#93000a;

    color:white;

}



.btn-secondary-custom{

    background:#ededf9;

    color:#191b23;

    border:none;

    border-radius:12px;

    padding:14px 24px;

    font-family:'Manrope',sans-serif;

    font-weight:600;

}



.btn-secondary-custom:hover{

    background:#e1e2ed;

}



</style>


</head>


<body>


<!-- Navbar remains unchanged if you use fragment -->

<div th:replace="~{Fragments/header :: navbar}"></div>



<main>


<div class="cancel-container">



<div class="cancel-card">



<!-- HEADER -->

<div class="cancel-header">


<div class="d-flex align-items-center gap-3">


<div class="warning-icon">

<i class="bi bi-exclamation-triangle-fill"></i>

</div>


<div>

<h3 class="mb-1">

Cancel Flight?

</h3>


<p class="mb-0"
style="color:#737686;">

Please review the details before confirming.

</p>


</div>


</div>


</div>





<!-- BODY -->

<div class="cancel-body">



<p class="mb-2"
style="color:#737686;">

You are cancelling:

</p>




<div class="flight-box">



<div class="flight-number">

<span th:text="${booking.flightPlan.flight.flightNumber}">
</span>

</div>



<div class="route mt-2">


<span th:text="${booking.flightPlan.departureAirport.city}">
</span>


<span class="mx-2 text-primary">

→

</span>


<span th:text="${booking.flightPlan.arrivalAirport.city}">
</span>


</div>



</div>






<div class="refund-box mb-4">


<div class="refund-label">

Refund Amount

</div>



<div class="refund-price">

$

<span th:text="${booking.totalAmount}">
</span>


</div>


</div>







<form th:action="@{/airline/cancel/{id}(id=${booking.bookingId})}"
method="post">





<label class="fw-semibold mb-2">

Reason for cancellation

</label>



<textarea name="reason"
class="form-control mb-4"
rows="4"
placeholder="Tell us why you are cancelling this flight..."
required></textarea>





<div class="d-flex gap-3">


<button type="submit"
class="btn-danger-custom flex-grow-1">

<i class="bi bi-x-circle me-2"></i>

Confirm Cancellation

</button>



<a href="/airline/history"
class="btn-secondary-custom text-decoration-none text-center flex-grow-1">

<i class="bi bi-arrow-left me-2"></i>

Keep Booking

</a>



</div>



</form>



</div>


</div>


</div>


</main>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
