<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Flight Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:'Segoe UI',sans-serif;
}

.page-title{
    font-size:32px;
    font-weight:700;
    color:#1d3557;
}

.flight-card{

    background:#fff;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    transition:.3s;
    margin-bottom:25px;

}

.flight-card:hover{

    transform:translateY(-4px);

    box-shadow:0 15px 35px rgba(0,0,0,.12);

}

.airline-icon{

    width:70px;
    height:70px;
    border-radius:50%;
    background:#eef4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
    color:#0d6efd;

}

.airline-name{

    font-size:20px;
    font-weight:700;

}

.flight-number{

    color:#6c757d;
    font-size:14px;

}

.time{

    font-size:34px;
    font-weight:bold;
    color:#1d3557;

}

.date{

    color:#6c757d;
    font-size:14px;

}

.route-arrow{

    font-size:28px;
    color:#0d6efd;

}

.city{

    font-weight:600;
    font-size:18px;

}

.price{

    font-size:30px;
    font-weight:bold;
    color:#0d6efd;

}

.badge-seat{

    background:#d1f7d6;
    color:#198754;
    padding:8px 14px;
    border-radius:30px;
    font-weight:600;

}

.btn-detail{

    border-radius:12px;
    padding:12px 22px;

}

@media(max-width:768px){

.time{

font-size:28px;

}

.airline-icon{

margin-bottom:15px;

}

}

</style>

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="page-title">
Available Flights
</h2>
<!-- Hello -->
<a th:href="@{/airline/search}"
class="btn btn-outline-primary">
<i class="bi bi-search"></i>
New Search
</a>

</div>

<div th:if="${#lists.isEmpty(flightPlans)}">

<div class="alert alert-warning">

<h5>No flights found.</h5>

<p>Please try another route or date.</p>

</div>

</div>

<div class="flight-card"
th:each="flightPlan : ${flightPlans}">

<div class="row align-items-center">

<!-- Airline -->

<div class="col-lg-2 text-center">

<div class="airline-icon mx-auto">

<i class="bi bi-airplane-fill"></i>

</div>

<div class="airline-name mt-3"
th:text="${flightPlan.flight.airline.airlineName}">
</div>

<div class="flight-number"
th:text="${flightPlan.flight.flightNumber}">
</div>

</div>

<!-- Route -->

<div class="col-lg-5">

<div class="row text-center align-items-center">

<div class="col">

<div class="time"
th:text="${#temporals.format(flightPlan.departureTime,'HH:mm')}">
</div>

<div class="date"
th:text="${#temporals.format(flightPlan.departureTime,'yyyy-MM-dd')}">
</div>

<div class="city"
th:text="${flightPlan.departureAirport.city}">
</div>

</div>

<div class="col-2">

<i class="bi bi-arrow-right route-arrow"></i>

</div>

<div class="col">

<div class="time"
th:text="${#temporals.format(flightPlan.arrivalTime,'HH:mm')}">
</div>

<div class="date"
th:text="${#temporals.format(flightPlan.arrivalTime,'yyyy-MM-dd')}">
</div>

<div class="city"
th:text="${flightPlan.arrivalAirport.city}">
</div>

</div>

</div>

</div>

<!-- Price -->

<div class="col-lg-2 text-center">

<div class="price">

$

<span th:text="${flightPlan.price}">
</span>

</div>

<div class="mt-2">

<span class="badge-seat">

<i class="bi bi-person-check-fill"></i>

<span th:text="${flightPlan.availableSeats}">
</span>

Seats Left

</span>

</div>

</div>

<!-- Button -->

<div class="col-lg-3 text-center">

<a class="btn btn-primary btn-detail"

th:href="@{/airline/flight/{id}(id=${flightPlan.flightPlanId},passengers=${passengers},
seatClass=${seatClass})}">

View Details

</a>

</div>

</div>

</div>

</div>

</body>

</html>
