<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Payment</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<style>


body{

background:#f5f7fb;
font-family:'Segoe UI',sans-serif;

}


.payment-section{

padding:70px 0;

}


.payment-card{

background:white;

border-radius:20px;

padding:40px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}



.payment-header{

text-align:center;

margin-bottom:30px;

}


.payment-header i{

font-size:45px;

color:#0d6efd;

}



.amount-box{

background:#eef5ff;

border-radius:15px;

padding:20px;

text-align:center;

margin-bottom:30px;

}


.amount-box h2{

color:#0d6efd;

font-weight:700;

}



.upload-box{

border:2px dashed #0d6efd;

border-radius:15px;

padding:35px;

text-align:center;

background:#fafcff;

}



.upload-box i{

font-size:40px;

color:#0d6efd;

}



.file-input{

margin-top:20px;

}



.btn-payment{

width:100%;

height:55px;

border-radius:12px;

background:#0d6efd;

border:none;

color:white;

font-weight:600;

font-size:17px;

}



.btn-payment:hover{

background:#0b5ed7;

}



.info-box{

margin-top:25px;

background:#fff8e8;

padding:15px;

border-radius:12px;

font-size:14px;

}



</style>

</head>



<body>


<section class="payment-section">


<div class="container">


<div class="row justify-content-center">


<div class="col-lg-6">


<div class="payment-card">



<div class="payment-header">

<i class="bi bi-credit-card"></i>

<h2>
Payment Confirmation
</h2>

<p class="text-muted">
Complete your payment by uploading KPay screenshot
</p>


</div>



<div class="amount-box">


<p>
Total Amount
</p>


<h2>

$ 

<span th:text="${payment.amount}">
</span>


</h2>


</div>





<form th:action="@{/airline/payment/upload}"

method="post"

enctype="multipart/form-data">



<input type="hidden"

name="paymentId"

th:value="${payment.paymentId}">





<div class="upload-box">


<i class="bi bi-cloud-arrow-up"></i>


<h5 class="mt-3">

Upload Payment Screenshot

</h5>


<p class="text-muted">

PNG or JPG format

</p>



<input type="file"

name="screenshot"

class="form-control file-input"

accept="image/*"

required>



</div>





<button class="btn-payment mt-4">


<i class="bi bi-check-circle"></i>

Submit Payment


</button>



</form>






<div class="info-box">


<i class="bi bi-info-circle"></i>


Your booking will be confirmed after admin verifies your payment screenshot.


</div>



</div>


</div>


</div>


</section>


</body>


</html>
