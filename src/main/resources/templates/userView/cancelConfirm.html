<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Confirm Cancellation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<div class="card shadow p-4">


<h3 class="text-danger">

<i class="bi bi-exclamation-triangle"></i>

Cancel Flight?

</h3>



<p>

You are cancelling:

</p>


<h5>

<span th:text="${booking.flightPlan.flight.flightNumber}">
</span>

</h5>



<p>

<span th:text="${booking.flightPlan.departureAirport.city}">
</span>

→

<span th:text="${booking.flightPlan.arrivalAirport.city}">
</span>


</p>



<p>

Refund Amount:

<b>

$

<span th:text="${booking.totalAmount}"></span>

</b>

</p>



<form th:action="@{/airline/cancel/{id}(id=${booking.bookingId})}"
method="post">


<label>
Reason
</label>


<textarea name="reason"
class="form-control mb-3"
required></textarea>



<button class="btn btn-danger">

Confirm Cancellation

</button>



<a href="/airline/history"
class="btn btn-secondary">

Keep Booking

</a>


</form>


</div>


</div>


</body>

</html>
