<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Payment Submitted</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<style>


body{

background:#f4f7fb;
font-family:'Segoe UI',sans-serif;

}



.success-section{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:40px;

}



.success-card{

background:white;

max-width:550px;

width:100%;

padding:45px;

border-radius:22px;

text-align:center;

box-shadow:0 15px 35px rgba(0,0,0,.08);

}



.success-icon{

width:90px;

height:90px;

border-radius:50%;

background:#e8f8ee;

display:flex;

align-items:center;

justify-content:center;

margin:auto;

}



.success-icon i{

font-size:45px;

color:#198754;

}



h1{

margin-top:25px;

font-weight:700;

}



.status-box{

margin-top:30px;

padding:20px;

border-radius:15px;

background:#fff8e5;

}



.status-badge{

display:inline-block;

padding:8px 20px;

border-radius:30px;

background:#ffc107;

color:#664d03;

font-weight:600;

}



.info{

margin-top:25px;

color:#6c757d;

font-size:15px;

}



.btn-main{

margin-top:30px;

height:50px;

border-radius:12px;

font-weight:600;

}



</style>


</head>



<body>


<section class="success-section">


<div class="success-card">



<div class="success-icon">

<i class="bi bi-check-lg"></i>

</div>




<h1>
Payment Submitted!
</h1>



<p class="text-muted">

Your payment screenshot has been received successfully.

</p>




<div class="status-box">


<p class="mb-2">

Payment Status

</p>


<span class="status-badge">

Pending Verification

</span>


</div>





<div class="info">


<i class="bi bi-info-circle"></i>


Our admin team will verify your payment.

Your booking will be confirmed after approval.



</div>






<div class="d-grid gap-3 mt-4">


<a th:href="@{/airline/history}"

class="btn btn-primary btn-main">


<i class="bi bi-ticket-perforated"></i>

View My Bookings


</a>





<a th:href="@{/airline/search}"

class="btn btn-outline-primary btn-main">


<i class="bi bi-search"></i>

Search More Flights


</a>



</div>




</div>


</section>


</body>

</html>
