<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Booking Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<div class="card shadow p-4">


<h2>

<i class="bi bi-ticket-perforated"></i>

Booking Details

</h2>


<hr>


<h4>

Flight:

<span th:text="${booking.flightPlan.flight.flightNumber}">
</span>

</h4>


<p>

Airline:

<span th:text="${booking.flightPlan.flight.airline.airlineName}">
</span>

</p>



<p>

Route:

<span th:text="${booking.flightPlan.departureAirport.city}">
</span>


→


<span th:text="${booking.flightPlan.arrivalAirport.city}">
</span>

</p>



<p>

Departure:

<span th:text="${booking.flightPlan.departureTime}">
</span>

</p>



<p>

Seat Class:

<span th:text="${booking.seatClass.className}">
</span>

</p>



<p>

Amount:

$

<span th:text="${booking.totalAmount}">
</span>

</p>



<p>

Status:

<span th:text="${booking.status}">
</span>

</p>



<a href="/airline/history"
class="btn btn-secondary">

Back to My Trips

</a>


</div>


</div>


</body>

</html>
