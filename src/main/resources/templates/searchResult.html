<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Flight Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>
Available Flights
</h2>


<div th:if="${#lists.isEmpty(flightPlans)}">

    <h4>
        No flights found.
    </h4>

</div>



<div class="card mb-3"
     th:each="flightPlan : ${flightPlans}">


<div class="card-body">


<h4>

<span th:text="${flightPlan.flight.flightNumber}">
</span>

</h4>



<p>

Airline:

<span th:text="${flightPlan.flight.airline.airlineName}">
</span>

</p>



<p>

From:

<span th:text="${flightPlan.departureAirport.city}">
</span>


↓

To:

<span th:text="${flightPlan.arrivalAirport.city}">
</span>

</p>




<p>

Departure:

<span th:text="${flightPlan.departureTime}">
</span>

</p>



<p>

Arrival:

<span th:text="${flightPlan.arrivalTime}">
</span>

</p>


<p>

Price:

$

<span th:text="${flightPlan.price}">
</span>

</p>



<p>

Available Seats:

<span th:text="${flightPlan.availableSeats}">
</span>

</p>



<a th:href="@{/airline/flight/{id}(id=${flightPlan.flightPlanId})}"
class="btn btn-primary">

View Details

</a>



</div>

</div>


</div>


</body>

</html>
