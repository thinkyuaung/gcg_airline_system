<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Flight Detail</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>Flight Details</h2>


<div class="card mt-4">

<div class="card-body">


<h3>
<span th:text="${flightPlan.flight.flightNumber}">
</span>
</h3>



<p>

Airline:

<span th:text="${flightPlan.flight.airline.airlineName}">
</span>

</p>



<hr>



<h5>Route</h5>


<p>

<span th:text="${flightPlan.departureAirport.city}">
</span>


&nbsp; → &nbsp;


<span th:text="${flightPlan.arrivalAirport.city}">
</span>

</p>



<p>

Departure:

<span th:text="${flightPlan.departureTime}">
</span>

</p>



<p>

Arrival:

<span th:text="${flightPlan.arrivalTime}">
</span>

</p>



<p>

Base Price:

$

<span th:text="${flightPlan.price}">
</span>

</p>



</div>

</div>





<!-- Features -->


<div class="card mt-4">

<div class="card-body">


<h4>
Flight Features
</h4>



<ul>

<li th:each="feature : ${features}">

<span th:text="${feature.featureName}">
</span>

</li>


</ul>


</div>

</div>





<!-- Seat Class -->


<div class="card mt-4">

<div class="card-body">


<h4>
Choose Seat Class
</h4>



<div th:each="seat : ${seatClasses}"
     class="form-check">


<input class="form-check-input"
       type="radio"
       name="seatClass"
       th:value="${seat.classId}">



<label class="form-check-label">


<span th:text="${seat.className}">
</span>


(
Multiplier:

<span th:text="${seat.priceMultiplier}">
</span>

)


</label>


</div>


</div>

</div>





<form th:action="@{/airline/booking}" method="post">


<input type="hidden"
       name="flightPlanId"
       th:value="${flightPlan.flightPlanId}">


<input type="hidden"
       name="passengers"
       value="1">


<div th:each="seat : ${seatClasses}">


<input type="radio"
       name="seatClassId"
       th:value="${seat.classId}"
       required>


<span th:text="${seat.className}">
</span>


</div>


<button type="submit"
        class="btn btn-primary mt-3">

Book Now

</button>


</form>



</div>


</body>

</html>
